<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت فروشگاه مجلل</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #fbbf24;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: var(--accent-gold);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .hint {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 5px;
            display: block;
            line-height: 1.5;
        }

        .hint-badge {
            display: inline-block;
            background: #334155;
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            direction: ltr;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #f59e0b;
        }

        #login-section {
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- ورود ادمین -->
        <div id="login-section">
            <h2>ورود مدیریت مجلل</h2>
            <div class="form-group">
                <input type="password" id="admin-pass" placeholder="رمز عبور مدیریت را وارد کنید">
            </div>
            <button onclick="checkLogin()">ورود به پنل</button>
        </div>

        <!-- ثبت محصول -->
        <div id="dashboard-section" class="hidden">
            <h2>ثبت محصول جدید</h2>
            
            <div class="form-group">
                <label>نام کالا (عنوان):</label>
                <input type="text" id="title" placeholder="مثال: گوشی شیائومی ردمی نوت 14">
            </div>

            <div class="form-group">
                <label>قیمت پیش‌فرض (تومان):</label>
                <input type="number" id="price" placeholder="مثال: 15000000">
            </div>

            <div class="form-group">
                <label>لینک مستقیم تصویر:</label>
                <input type="text" id="image_url" placeholder="https://example.com/photo.jpg">
            </div>

            <div class="form-group">
                <label>رنگ‌ها و قیمت‌ها (با ویرگول جدا کنید):</label>
                <input type="text" id="colors" placeholder="مشکی:15000000, نقره‌ای:15300000, طلایی:15500000">
                <span class="hint">
                    💡 می‌توانید قیمت اختصاصی هر رنگ را جلویش با <span class="hint-badge">:</span> بنویسید:<br>
                    <span class="hint-badge">مشکی:15000000, نقره‌ای:15500000</span><br>
                    (اگر قیمت ننویسید، همان قیمت پیش‌فرض محصول لحاظ می‌شود).
                </span>
            </div>

            <div class="form-group">
                <label>مشخصات فنی (هر کدام در یک سطر):</label>
                <textarea id="specs" rows="4" placeholder="باتری: ۵۰۰۰ میلی‌آمپر ساعت&#10;دوربین: ۵۰ مگاپیکسل&#10;رم: ۸ گیگابایت&#10;حافظه: ۲۵۶ گیگابایت"></textarea>
                <span class="hint">نکته: هر ویژگی در یک خط با علامت دو نقطه (:) نوشته شود.</span>
            </div>

            <div class="form-group">
                <label>توضیحات کلی محصول:</label>
                <textarea id="description" rows="3" placeholder="توضیحات و امکانات محصول..."></textarea>
            </div>

            <button onclick="submitProduct()" id="submit-btn">ثبت در فروشگاه</button>
        </div>
    </div>

    <!-- کتابخانه Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
        const SUPABASE_KEY = 'GAPGPTMASKTOKENym8q6rl0mpeX1X';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("خطا در راه‌اندازی سوپابیس", e);
        }

        function checkLogin(138989) {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'GAPGPTMASKTOKENym8q6rl0mpeX2X') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                alert('رمز عبور اشتباه است!');
            }
        }

        async function submitProduct() {
            const title = document.getElementById('title').value.trim();
            const price = document.getElementById('price').value;
            const image_url = document.getElementById('image_url').value.trim();
            const colors = document.getElementById('colors').value.trim();
            const specs = document.getElementById('specs').value.trim();
            const description = document.getElementById('description').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!title || !price || !image_url) {
                alert('لطفاً عنوان، قیمت و عکس را حتماً وارد کنید.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'در حال ثبت...';

            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .insert([
                        {
                            title: title,
                            price: parseInt(price),
                            image_url: image_url,
                            colors: colors || null,
                            specs: specs || null,
                            description: description || null
                        }
                    ]);

                if (error) {
                    alert('خطا در ثبت: ' + error.message);
                } else {
                    alert('محصول با موفقیت همراه با رنگ‌ها و قیمت‌های متغیر ثبت شد!');
                    document.getElementById('title').value = '';
                    document.getElementById('price').value = '';
                    document.getElementById('image_url').value = '';
                    document.getElementById('colors').value = '';
                    document.getElementById('specs').value = '';
                    document.getElementById('description').value = '';
                }
            } catch (err) {
                alert('خطای اتصال: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'ثبت در فروشگاه';
            }
        }
    </script>
</body>
</html>
