<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت فروشگاه مجلل</title>
  <style>
    body {
      background-color: #0f1115;
      color: #f1f1f1;
      font-family: Tahoma, sans-serif;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 520px;
      margin: 20px auto;
      background: #181b20;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #2a2e39;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      text-align: center;
      color: #dfb15b;
      margin-top: 0;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      margin: 12px 0 6px;
      color: #aaa;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333946;
      background: #0f1115;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #dfb15b;
    }
    button {
      width: 100%;
      background: #dfb15b;
      color: #111;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }
    button:hover {
      background: #f1c26b;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }
    .back-link:hover {
      color: #dfb15b;
    }
  </style>
</head>
<body>

<div class="container" id="loginBox">
  <h2>ورود به پنل مدیریت</h2>
  <label>رمز عبور ادمین:</label>
  <input type="password" id="adminPass" placeholder="رمز را وارد کنید...">
  <button onclick="checkPass()">ورود</button>
</div>

<div class="container" id="adminPanel" style="display: none;">
  <h2>ثبت آگهی جدید</h2>
  
  <label>عنوان کالا *</label>
  <input type="text" id="title" placeholder="مثلاً: شیائومی نوت 14">

  <label>دسته‌بندی *</label>
  <select id="category">
    <option value="موبایل">موبایل</option>
    <option value="لوازم خانگی">لوازم خانگی</option>
    <option value="سرویس چوب">سرویس چوب</option>
  </select>

  <label>قیمت (تومان) *</label>
  <input type="number" id="price" placeholder="مثلاً: 25000000">

  <label>لینک مستقیم تصویر (از uupload یا imgbb) *</label>
  <input type="text" id="image_url" placeholder="https://...">

  <label>توضیحات و مشخصات آگهی</label>
  <textarea id="description" rows="4" placeholder="توضیحات تکمیلی کالا..."></textarea>

  <button id="submitBtn" onclick="submitProduct()">انتشار آگهی</button>
  <a href="index.html" class="back-link">← مشاهده فروشگاه</a>
</div>

<script>
  // =================== تنظیمات Supabase ===================
  const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cnKr9_hRibLAttI-SkKoMA_cIbYIiWv';
  const ADMIN_PASSWORD = '138989';
  // ========================================================

  function checkPass() {
    const input = document.getElementById('adminPass').value;
    if (input === ADMIN_PASSWORD) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    } else {
      alert('رمز عبور اشتباه است!');
    }
  }

  async function submitProduct() {
    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const price = document.getElementById('price').value.trim();
    const image_url = document.getElementById('image_url').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!title || !price || !image_url) {
      alert('لطفاً عنوان، قیمت و لینک عکس را وارد کنید.');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'در حال ثبت در دیتابیس...';

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          title: title,
          category: category,
          price: Number(price),
          image_url: image_url,
          description: description
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || 'خطا در ثبت اطلاعات');
      }

      alert('آگهی با موفقیت در فروشگاه ثبت شد!');
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('image_url').value = '';
      document.getElementById('description').value = '';
    } catch (err) {
      alert('خطا در ثبت: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = 'انتشار آگهی';
    }
  }
</script>

</body>
</html>
