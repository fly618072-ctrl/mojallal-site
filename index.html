<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه مجلل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* استایل‌های اصلی شما حفظ شده */
        body { font-family: Tahoma, Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .color-circle { width: 30px; height: 30px; border-radius: 50%; display: inline-block; margin: 5px; border: 2px solid #555; transition: transform 0.2s; }
        .color-circle.active { border-color: #fff; transform: scale(1.2); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 10px; max-width: 500px; width: 90%; }
    </style>
</head>
<body>

    <div id="product-grid" class="product-grid"></div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <img id="modal-image" src="" style="width:100%; height:auto;">
            <p id="modal-description"></p>
            <div id="color-container"></div>
            <h3 id="modal-price"></h3>
            <button onclick="document.getElementById('product-modal').style.display='none'">بستن</button>
        </div>
    </div>

    <script>
        // === تنظیمات سوپابیس (اینجا را با کلیدهای خودتان پر کنید) ===
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProducts() {
            const { data, error } = await client.from('products').select('*');
            if (error) { console.error(error); return; }
            const grid = document.getElementById('product-grid');
            data.forEach(product => {
                const card = document.createElement('div');
                card.innerHTML = `<h3>${product.title}</h3><button onclick='openDetails(${JSON.stringify(product)})'>مشاهده</button>`;
                grid.appendChild(card);
            });
        }

        function openDetails(product) {
            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-image').src = product.image_url;
            document.getElementById('modal-description').innerText = product.description || '';
            
            const colorContainer = document.getElementById('color-container');
            const priceDisplay = document.getElementById('modal-price');
            colorContainer.innerHTML = '';

            // نمایش رنگ‌ها و قیمت‌ها
            if (product.colors) {
                const colorList = product.colors.split(',').map(s => s.trim()).filter(Boolean);
                colorList.forEach((item, index) => {
                    const [cName, cPrice] = item.split(':').map(s => s ? s.trim() : '');
                    const finalPrice = cPrice || product.price;

                    const circle = document.createElement('div');
                    circle.className = 'color-circle';
                    circle.style.backgroundColor = cName.includes('مشکی') ? '#000' : '#777';
                    
                    if (index === 0) {
                        circle.classList.add('active');
                        priceDisplay.innerText = Number(finalPrice).toLocaleString('fa-IR') + ' تومان';
                    }

                    circle.onclick = function() {
                        document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('active'));
                        circle.classList.add('active');
                        priceDisplay.innerText = Number(finalPrice).toLocaleString('fa-IR') + ' تومان';
                    };
                    colorContainer.appendChild(circle);
                });
            } else {
                priceDisplay.innerText = Number(product.price).toLocaleString('fa-IR') + ' تومان';
            }

            document.getElementById('product-modal').style.display = 'flex';
        }

        loadProducts();
    </script>
</body>
</html>
