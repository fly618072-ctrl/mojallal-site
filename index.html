<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>فروشگاه مجلل</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0e0e0e;--card:#1a1a1a;--ink:#090909;--gold:#d4af37;--em:#e5c158;--ivory:#f6efdc;--text:#ece8dc;--muted:#9a9488;--line:#2d2d2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Vazirmatn,Tahoma,sans-serif;overflow-x:hidden}.wrap{max-width:1280px;margin:auto;padding:0 16px}button{cursor:pointer;color:inherit;font:inherit;border:0;background:none}a{color:inherit;text-decoration:none}header{position:sticky;top:0;background:var(--ink);z-index:5;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:18px;padding:12px 0}.brand{color:var(--gold);font-size:22px;font-weight:900;white-space:nowrap}.search{flex:1;background:#1c1c1c;padding:12px;border-radius:12px}.search input{border:0;outline:0;background:none;color:white;width:90%}.nav,.circles,.sort{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.nav button,.sort button{white-space:nowrap;padding:10px;color:var(--muted)}.active{color:var(--ivory)!important;border-bottom:2px solid var(--gold)!important}.hero{margin-top:16px;padding:28px 36px;border-radius:20px;background:radial-gradient(circle at 15% 20%,#64501f,transparent 55%),repeating-linear-gradient(45deg,#111 0 24px,#211d13 24px 25px);min-height:180px}.hero h1{font-size:28px;color:var(--ivory)}.hero p{color:#d9d2bd}.circles{justify-content:center;padding:20px}.circle{min-width:85px;text-align:center;color:var(--muted)}.circle i{display:grid;place-items:center;margin:auto auto 6px;width:62px;height:62px;border-radius:18px;background:var(--card);font-style:normal;font-size:26px}.amazing{display:none;margin:16px 0;background:var(--ink);border:1px solid #3a321a;border-radius:16px;padding:14px}.amazing.show{display:block}.strip{display:flex;gap:10px;overflow:auto}.toolbar{display:flex;align-items:center;gap:12px;margin:22px 0 12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card{min-width:0;background:var(--card);padding:13px;display:flex;flex-direction:column;gap:10px;text-align:right;cursor:pointer}.strip .card{min-width:190px;max-width:190px}.thumb{background:white;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.card h3{font-size:14px;line-height:1.8;height:48px;overflow:hidden;margin:0}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.tag{background:#2a2310;color:var(--em);padding:3px 8px;border-radius:6px}.price{color:var(--ivory);font-size:17px;font-weight:900}.price small{font-size:11px;color:var(--muted);font-weight:400}.status{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}.hide{display:none!important}.crumbs{padding:18px 0;color:var(--muted)}.crumbs button{color:var(--muted)}.pdp{display:grid;grid-template-columns:1fr 1fr 340px;gap:16px}.panel,.buy{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.pimg{background:white;border-radius:12px;min-height:320px;display:grid;place-items:center}.pimg img{max-width:100%;max-height:400px;object-fit:contain}.pinfo h1{color:var(--ivory);font-size:21px;line-height:1.8}.desc{line-height:2;color:#cfc9ba;white-space:pre-line}.buy{position:sticky;top:110px;border-top:4px solid var(--gold);height:max-content}.seller{padding-bottom:12px;border-bottom:1px solid var(--line)}.big{font-size:24px;font-weight:900;color:var(--ivory);margin:18px 0}.big small{font-size:12px;color:var(--muted);font-weight:400}.btn{background:var(--gold);color:#111;border-radius:10px;padding:12px;font-weight:800}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.cmp-toggle{border:1px solid var(--line);border-radius:8px;padding:8px}.cmp-toggle.on{border-color:var(--gold);color:var(--em)}.similar{margin-top:24px}.cmpbar{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:9px 14px}.cmp-items{flex:1;display:flex;gap:8px;overflow:auto}.cmp-items span{white-space:nowrap;background:var(--bg);padding:8px;border-radius:8px}.backdrop{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.backdrop.open{display:flex}.drawer{background:var(--card);padding:20px;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.cmp-table{width:100%;border-collapse:collapse}.cmp-table td,.cmp-table th{padding:10px;border-bottom:1px solid var(--line);text-align:right}.cmp-table th{color:var(--muted)}.pricebar{display:none}footer{text-align:center;padding:28px;background:var(--ink);margin-top:35px;color:var(--muted)}.error{color:#ff9999}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#090909;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;z-index:20;display:none}.toast.show{display:block}
@media(max-width:900px){.pdp{grid-template-columns:1fr}.buy{position:static}.pimg{min-height:250px}.pricebar{display:flex;position:fixed;bottom:10px;left:10px;right:10px;z-index:7;gap:10px;align-items:center;padding:10px;background:#111;border:1px solid var(--gold);border-radius:16px}.pricebar .btn{flex:1}.pricebar .big{font-size:17px;margin:0}body.product-on{padding-bottom:80px}body.has-cmp .pricebar{bottom:70px}}@media(max-width:650px){.top{flex-wrap:wrap}.search{order:2;flex-basis:100%}.hero{padding:20px}.hero h1{font-size:22px}.circles{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pdp{gap:10px}}
</style></head><body>
<header><div class="wrap"><div class="top"><a href="#" class="brand" data-home>♛ فروشگاه مجلل</a><label class="search">🔍 <input id="q" type="search" placeholder="جستجو در فروشگاه مجلل..." autocomplete="off"></label></div><nav class="nav" id="nav"></nav></div></header>
<main class="wrap" id="home"><section class="hero"><h1>بهترین کالاها با قیمت مناسب</h1><p>موبایل، لوازم خانگی و سرویس چوب را از نزدیک ببینید و همان‌جا انتخاب کنید.</p></section><div class="circles" id="circles"></div><section class="amazing" id="amazing"><b>🔥 تازه‌ترین آگهی‌ها</b><div class="strip" id="strip"></div></section><div class="toolbar"><span id="count"></span><div class="sort" id="sort"><button class="active" data-sort="new">جدیدترین</button><button data-sort="cheap">ارزان‌ترین</button><button data-sort="exp">گران‌ترین</button></div></div><div class="grid" id="grid"><div class="status">در حال بارگذاری کالاها…</div></div></main>
<section class="wrap hide" id="pdp"><div class="crumbs"><button data-home>فروشگاه مجلل</button> / <button id="p-cat"></button> / <b id="p-crumb"></b></div><div class="pdp"><div class="panel"><div class="pimg"><img id="p-img" alt=""></div></div><div class="panel pinfo"><span id="p-category" style="color:var(--em)"></span><h1 id="p-title"></h1><div id="p-desc" class="desc"></div></div><aside class="buy"><b>فروشنده</b><div class="seller">👑 فروشگاه مجلل</div><div id="p-price" class="big"></div><p>خرید فقط به‌صورت حضوری از فروشگاه</p><button class="btn" data-contact>💬 ارتباط با فروشگاه</button><div id="p-actions" class="actions"></div></aside></div><section class="similar hide" id="similar-wrap"><h2>کالاهای مشابه</h2><div class="grid" id="similar"></div></section></section>
<footer>فروشگاه مجلل — خرید مطمئن، انتخاب راحت</footer><div class="pricebar hide" id="pricebar"><div id="mobile-price" class="big"></div><button class="btn" data-contact>💬 ارتباط با فروشگاه</button></div><div class="cmpbar hide" id="cmpbar"><div class="cmp-items" id="cmp-items"></div><button class="btn" id="cmp-go">مقایسه</button><button id="cmp-clear">پاک‌کردن</button></div><div class="backdrop" id="cmp"><div class="drawer"><button id="cmp-close">✕ بستن</button><h2>مقایسه کالاها</h2><div id="cmp-body"></div></div></div><div class="toast" id="toast"></div>
<script>
// Public browser key only. Never put a Supabase service_role/secret key in HTML.
const SUPABASE_URL='https://fermurffpsawrpulsxun.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcm11cmZmcHNhd3JwdWxzeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODkzODYsImV4cCI6MjEwNjk2NTM4Nn0.abW-PkWxNsybuDdmaf4PieW9kc1NPqjTdME9_DyAByg';
const CATS=[['همه','🛍️','همه کالاها'],['گوشی','📱','موبایل'],['لوازم خانگی','🏠','لوازم خانگی'],['مبلمان','🛋️','سرویس چوب']];
const alias={'موبایل':'گوشی','سرویس چوب':'مبلمان'},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),imgURL=u=>/^https?:\/\//i.test(u||'')?u:'',money=n=>Number(n||0)?Number(n).toLocaleString('fa-IR')+' تومان':'قیمت توافقی';
let db=null,all=[],category='همه',query='',sort='new',compare=[];
function buildCats(){for(const id of ['nav','circles'])$(id).innerHTML=CATS.map(c=>id==='nav'?`<button data-cat="${esc(c[0])}" class="${category===c[0]?'active':''}">${c[2]}</button>`:`<button class="circle ${category===c[0]?'active':''}" data-cat="${esc(c[0])}"><i>${c[1]}</i>${c[2]}</button>`).join('')}
function price(p){return Number(p.price)||0}function card(p){return `<article class="card" tabindex="0" role="link" data-id="${esc(p.id)}"><div class="thumb"><img src="${esc(imgURL(p.image_url))}" alt="${esc(p.title)}" loading="lazy"></div><h3>${esc(p.title||'بدون عنوان')}</h3><div class="meta"><span class="tag">${esc(p.category||'متفرقه')}</span><button class="cmp-toggle ${compare.includes(String(p.id))?'on':''}" data-cmp="${esc(p.id)}">⚖ مقایسه</button></div><div class="price">${money(price(p))}</div></article>`}
function filtered(){let a=all.filter(p=>(category==='همه'||(alias[p.category]||p.category)===category)&&(!query||`${p.title||''} ${p.description||''}`.toLowerCase().includes(query.toLowerCase())));if(sort==='cheap')a.sort((x,y)=>(price(x)||Infinity)-(price(y)||Infinity));if(sort==='exp')a.sort((x,y)=>price(y)-price(x));return a}
function render(){let a=filtered();$('grid').innerHTML=a.length?a.map(card).join(''):'<div class="status">کالایی پیدا نشد.</div>'; $('count').textContent=`${a.length.toLocaleString('fa-IR')} کالا`;let recent=all.slice(0,8);$('amazing').classList.toggle('show',category==='همه'&&!query&&recent.length>=3);$('strip').innerHTML=recent.map(card).join('');updateCompare()}
function byId(id){return all.find(p=>String(p.id)===String(id))}
function showProduct(p){$('home').classList.add('hide');$('pdp').classList.remove('hide');$('pricebar').classList.remove('hide');document.body.classList.add('product-on');document.title=(p.title||'کالا')+' | فروشگاه مجلل';$('p-title').textContent=p.title||'';$('p-crumb').textContent=p.title||'';$('p-category').textContent=p.category||'متفرقه';$('p-cat').textContent=p.category||'متفرقه';$('p-img').src=imgURL(p.image_url);$('p-img').onerror=()=>{$('p-img').removeAttribute('src')};$('p-desc').textContent=p.description||'توضیحی ثبت نشده است.';$('p-price').textContent=money(price(p));$('mobile-price').textContent=money(price(p));$('p-actions').innerHTML=`<button data-share>🔗 اشتراک‌گذاری</button><button data-cmp="${esc(p.id)}">⚖ مقایسه</button>`;let sim=all.filter(x=>String(x.id)!==String(p.id)&&x.category===p.category).slice(0,4);$('similar-wrap').classList.toggle('hide',!sim.length);$('similar').innerHTML=sim.map(card).join('');updateCompare();scrollTo({top:0,behavior:'smooth'})}
function route(){const m=location.hash.match(/^#p-(.+)$/);const p=m&&byId(decodeURIComponent(m[1]));if(p)showProduct(p);else{$('pdp').classList.add('hide');$('home').classList.remove('hide');$('pricebar').classList.add('hide');document.body.classList.remove('product-on');document.title='فروشگاه مجلل'}}
function toggleCompare(id){id=String(id);if(compare.includes(id))compare=compare.filter(x=>x!==id);else if(compare.length<3)compare.push(id);else notify('حداکثر ۳ کالا را می‌توانید مقایسه کنید');updateCompare()}
function updateCompare(){compare=compare.filter(byId);$('cmpbar').classList.toggle('hide',!compare.length);document.body.classList.toggle('has-cmp',!!compare.length);$('cmp-items').innerHTML=compare.map(id=>`<span>${esc(byId(id)?.title||'')}</span>`).join('');document.querySelectorAll('[data-cmp]').forEach(b=>b.classList.toggle('on',compare.includes(String(b.dataset.cmp))))}
function compareView(){if(compare.length<2){notify('برای مقایسه حداقل ۲ کالا انتخاب کنید');return}let ps=compare.map(byId);$('cmp-body').innerHTML='<table class="cmp-table"><tr><th>مشخصات</th>'+ps.map(p=>`<td><b>${esc(p.title)}</b><br><button data-open="${esc(p.id)}">مشاهده</button></td>`).join('')+'</tr><tr><th>قیمت</th>'+ps.map(p=>`<td>${money(price(p))}</td>`).join('')+'</tr><tr><th>دسته</th>'+ps.map(p=>`<td>${esc(p.category||'—')}</td>`).join('')+'</tr><tr><th>توضیحات</th>'+ps.map(p=>`<td>${esc(p.description||'—')}</td>`).join('')+'</tr></table>';$('cmp').classList.add('open')}
function notify(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function load(){if(SUPABASE_ANON_KEY.includes('PASTE_')){$('grid').innerHTML='<div class="status error">کلید عمومی Supabase را در SUPABASE_ANON_KEY وارد کنید.</div>';return}if(!window.supabase){$('grid').innerHTML='<div class="status error">کتابخانه Supabase بارگذاری نشد.</div>';return}try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data,error}=await db.from('products').select('*').order('id',{ascending:false});if(error)throw error;all=data||[];render();route()}catch(e){console.error('Supabase:',e);$('grid').innerHTML='<div class="status error">خطا در دریافت محصولات؛ آدرس، کلید عمومی، جدول products و دسترسی RLS را بررسی کنید.</div>'}}
buildCats();$('q').addEventListener('input',e=>{query=e.target.value.trim();render()});document.addEventListener('click',e=>{let t=e.target.closest('button,[data-id]');if(!t)return;if(t.hasAttribute('data-home')){e.preventDefault();location.hash='';route();scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.cat){category=t.dataset.cat;buildCats();render()}else if(t.dataset.sort){sort=t.dataset.sort;document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('active',b===t));render()}else if(t.dataset.cmp){e.preventDefault();toggleCompare(t.dataset.cmp)}else if(t.dataset.id){location.hash='p-'+encodeURIComponent(t.dataset.id)}else if(t.dataset.contact){notify('شناسه پیام‌رسان فروشگاه را در لینک‌های تماس تنظیم کنید.')}else if(t.dataset.share){navigator.clipboard?.writeText(location.href).then(()=>notify('لینک کالا کپی شد')).catch(()=>notify(location.href))}else if(t.dataset.open){$('cmp').classList.remove('open');location.hash='p-'+encodeURIComponent(t.dataset.open)}else if(t.id==='cmp-go')compareView();else if(t.id==='cmp-clear'){compare=[];updateCompare()}else if(t.id==='cmp-close')$('cmp').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.card[data-id]'))location.hash='p-'+encodeURIComponent(e.target.dataset.id);if(e.key==='Escape')$('cmp').classList.remove('open')});$('cmp').addEventListener('click',e=>{if(e.target===$('cmp'))$('cmp').classList.remove('open')});window.addEventListener('hashchange',route);load();
</script></body></html>
