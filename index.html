<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>فروشگاه مجلل</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0e0e0e;--card:#1a1a1a;--ink:#090909;--head:#f6efdc;--em:#e5c158;--gold:#d4af37;--gold-d:#e5c158;--gold-s:#2a2310;--ivory:#f6efdc;--text:#ece8dc;--muted:#9a9488;--line:#2d2d2d;--crim:#d2343c}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',Tahoma,sans-serif}body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.wrap{max-width:1280px;margin:0 auto;padding:0 16px}.hide{display:none!important}
header{background:var(--ink);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:20px;padding:12px 0 8px}.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:900;font-size:22px;white-space:nowrap;text-decoration:none}.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#1c1c1c;border:1px solid transparent;border-radius:12px;padding:0 14px;height:46px}.search:focus-within{border-color:var(--gold)}.search input{flex:1;border:0;background:none;outline:0;font-size:14px;color:var(--text);min-width:0}.nav{display:flex;gap:4px;overflow-x:auto}.nav button{padding:10px 14px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.nav button.active{color:var(--head);font-weight:800;border-bottom-color:var(--gold)}
.hero{margin-top:16px;border-radius:22px;min-height:210px;padding:34px 44px;color:var(--ivory);display:flex;flex-direction:column;justify-content:center;gap:12px;background:radial-gradient(circle at 12% 18%,rgba(233,200,120,.28),transparent 55%),repeating-linear-gradient(45deg,transparent 0 24px,rgba(214,178,96,.13) 24px 25px),var(--ink)}.hero h1{font-size:32px;font-weight:900}.hero p{font-size:15px;color:#d9d2bd;max-width:34em;line-height:1.9}.circles{display:flex;gap:16px;overflow-x:auto;padding:22px 4px 6px;justify-content:center}.circle{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:84px;font-size:13px;color:var(--muted)}.circle i{width:66px;height:66px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:29px;font-style:normal}.circle.active{color:var(--head);font-weight:800}.circle.active i{border:2px solid var(--gold);background:var(--gold-s)}
.toolbar{display:flex;align-items:center;gap:14px;margin:26px 0 12px;flex-wrap:wrap}.sort{display:flex;gap:4px;overflow-x:auto}.sort button{padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.sort button.active{color:var(--head);font-weight:800;border-bottom-color:var(--gold)}.count{font-size:13px;color:var(--muted)}.filter-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800;color:var(--head)}.filter-btn.on{border-color:var(--gold);color:var(--gold)}#fcount{background:var(--gold);color:#111;border-radius:10px;min-width:19px;height:19px;display:grid;place-items:center;font-size:11px;padding:0 5px}.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.f-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}.f-group label{font-size:12.5px;color:var(--muted)}.f-group input,.f-group select{height:42px;border:1px solid var(--line);background:#1c1c1c;color:var(--text);border-radius:10px;padding:0 12px;font-size:14px;outline:0;width:100%}.f-group input:focus,.f-group select:focus{border-color:var(--gold)}.f-check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;height:42px;cursor:pointer}.f-check input{width:18px;height:18px;accent-color:var(--gold)}.f-clear{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted)}.f-clear:hover{color:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:right;min-width:0}.card:hover .card-title{color:var(--em)}.thumb{background:#fff;border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.card-title{font-size:13.5px;font-weight:700;line-height:1.9;min-height:50px;overflow:hidden}.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.tag{background:var(--gold-s);color:var(--gold-d);padding:2px 9px;border-radius:6px;font-weight:700}.price{display:flex;align-items:baseline;gap:4px;justify-content:flex-end;font-weight:900;font-size:17px;color:var(--head)}.price small{font-size:12px;font-weight:400;color:var(--muted)}.status{text-align:center;padding:60px 20px;color:var(--muted);background:var(--card);grid-column:1/-1}
.address-section{background:var(--card,#1c1c1c);border:1px solid var(--line,#333);border-radius:16px;padding:24px;margin:32px 0 16px;color:var(--text,#fff);text-align:right}.address-section h3{margin-bottom:12px;font-size:18px;font-weight:bold}.address-section p{margin-bottom:16px;line-height:1.9;color:#ccc;font-size:14px}.address-map{border-radius:12px;overflow:hidden;border:1px solid var(--line,#333)}.address-map iframe{display:block;width:100%;height:280px;border:0}
footer{margin-top:40px;background:var(--ink);border-top:1px solid #3a321a;padding:30px 0;text-align:center;color:#b9c7c3;font-size:13px}footer b{display:block;color:var(--ivory);font-size:18px;margin-bottom:6px}.contact-links{display:flex;justify-content:center;gap:12px;margin-top:12px}.contact-links a{color:var(--gold);text-decoration:none;font-weight:bold}
@media(max-width:700px){.hero{padding:26px 22px;min-height:170px}.hero h1{font-size:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px}.price{font-size:15px}.circles{justify-content:flex-start}.top{flex-wrap:wrap;gap:10px}.search{order:3;flex-basis:100%}.address-section{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><a href="#" class="brand" data-home><svg width="30" height="26" viewBox="0 0 28 24" fill="#b8893b" aria-hidden="true"><path d="M2 8l6 5 6-9 6 9 6-5-2 14H4z"/></svg>فروشگاه مجلل</a><label class="search"><span>🔍</span><input id="q" type="search" placeholder="جستجو در فروشگاه مجلل..." autocomplete="off"></label></div><nav class="nav" id="nav" aria-label="دسته‌بندی‌ها"></nav></div></header>
<main class="wrap" id="home">
<section class="hero"><h1>بهترین کالاها با قیمت مناسب</h1><p>موبایل، لوازم خانگی و سرویس چوب را از نزدیک ببینید و همان‌جا انتخاب کنید.</p></section>
<div class="circles" id="circles"></div>
<div class="toolbar"><button type="button" class="filter-btn" id="fbtn">⚙️ فیلتر <span id="fcount" class="hide"></span></button><span class="count" id="count"></span><div class="sort" id="sort"><button class="active" data-s="new">جدیدترین</button><button data-s="cheap">ارزان‌ترین</button><button data-s="exp">گران‌ترین</button></div></div>
<div class="filters hide" id="filters">
  <div class="f-group"><label for="f-brand">برند</label><select id="f-brand"><option value="">همهٔ برندها</option></select></div>
  <div class="f-group"><label for="f-min">قیمت از (تومان)</label><input id="f-min" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۱۰۰۰۰۰۰۰"></div>
  <div class="f-group"><label for="f-max">تا (تومان)</label><input id="f-max" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۹۰۰۰۰۰۰۰"></div>
  <label class="f-check"><input type="checkbox" id="f-disc"> فقط کالاهای تخفیف‌دار</label>
  <button type="button" class="f-clear" id="clear-filter">پاک کردن فیلترها</button>
</div>
<div id="grid" class="grid" aria-live="polite"></div>
<section class="address-section">
  <h3>📍 آدرس فروشگاه (مراجعه حضوری)</h3>
  <p>مشهد، [لطفاً آدرس دقیق خود را اینجا بنویسید]</p>
  <div class="address-map"><iframe src="[لطفاً لینک امبد گوگل مپ خود را اینجا قرار دهید]" width="100%" height="280" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="نقشهٔ آدرس فروشگاه"></iframe></div>
</section>
</main>
<footer><div class="wrap"><b>فروشگاه مجلل</b>خرید مطمئن، انتخاب راحت<div class="contact-links"><a href="https://rubika.ir/mojallal_market" target="_blank" rel="noopener noreferrer">روبیکا</a><a href="https://eitaa.com/mojallal_support" target="_blank" rel="noopener noreferrer">ایتا</a></div></div></footer>
<script>
'use strict';
const CATS=[{n:'همه',l:'همه کالاها',i:'🛍️'},{n:'گوشی',l:'موبایل',i:'📱'},{n:'لوازم خانگی',l:'لوازم خانگی',i:'🏠'},{n:'مبلمان',l:'سرویس چوب',i:'🛋️'}];
const ALIAS={'موبایل':'گوشی','سرویس چوب':'مبلمان'};
const norm=c=>{c=String(c||'').trim();return ALIAS[c]||c};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum=t=>{const n=String(t??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،٬\s]/g,'');return /^\d+$/.test(n)?Number(n):0};
const fmt=n=>n?Number(n).toLocaleString('fa-IR'):'توافقی';
const brandOf=p=>String(p.brand||p.maker||'').trim();
const minPrice=p=>{const n=Number(p.price)||0;return n>0?n:0};
const discount=p=>{const now=minPrice(p),old=Number(p.old_price)||0;return old>now&&now?Math.round((1-now/old)*100):0};
let all=[],cat='همه',sortBy='new',query='',filt={min:0,max:0,disc:false,brand:''};
function buildNav(){
  $('nav').innerHTML=CATS.map(c=>`<button type="button" data-cat="${esc(c.n)}" class="${c.n===cat?'active':''}">${esc(c.l)}</button>`).join('');
  $('circles').innerHTML=CATS.map(c=>`<button type="button" class="circle ${c.n===cat?'active':''}" data-cat="${esc(c.n)}"><i>${c.i}</i>${esc(c.l)}</button>`).join('');
}
function buildBrandOptions(){
  const brands=[...new Set(all.map(brandOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  $('f-brand').innerHTML='<option value="">همهٔ برندها</option>'+brands.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('f-brand').value=filt.brand||'';
}
function cardHTML(p){
  const d=discount(p),price=minPrice(p);
  const img=/^https?:\/\//i.test(p.image_url||'')?p.image_url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#f1f2f4"/><text x="50" y="64" font-size="40" text-anchor="middle">👑</text></svg>');
  return `<article class="card" tabindex="0"><div class="thumb"><img src="${esc(img)}" alt="${esc(p.title||'')}"></div><h3 class="card-title">${esc(p.title||'بدون عنوان')}</h3><div class="meta"><span class="tag">${esc(p.category||'متفرقه')}</span><span>${esc(brandOf(p))}</span></div>${d?`<div class="meta"><span>تخفیف ${d.toLocaleString('fa-IR')}٪</span><del>${fmt(p.old_price)}</del></div>`:''}<div class="price">${fmt(price)} ${price?'<small>تومان</small>':''}</div></article>`;
}
function applyFilterUI(){
  const n=(filt.min?1:0)+(filt.max?1:0)+(filt.disc?1:0)+(filt.brand?1:0),badge=$('fcount');
  badge.textContent=n.toLocaleString('fa-IR');badge.classList.toggle('hide',!n);$('fbtn').classList.toggle('on',n>0);
}
function render(){
  let list=all.filter(p=>cat==='همه'||norm(p.category)===cat);
  if(query){const q=query.toLocaleLowerCase();list=list.filter(p=>[p.title,p.description,brandOf(p),p.maker].some(v=>String(v||'').toLocaleLowerCase().includes(q)));}
  if(filt.brand)list=list.filter(p=>brandOf(p)===filt.brand);
  if(filt.min||filt.max||filt.disc)list=list.filter(p=>{const price=minPrice(p);if((filt.min||filt.max)&&!price)return false;if(filt.min&&price<filt.min)return false;if(filt.max&&price>filt.max)return false;if(filt.disc&&!discount(p))return false;return true;});
  if(sortBy==='cheap')list=[...list].sort((a,b)=>(minPrice(a)||Infinity)-(minPrice(b)||Infinity));
  if(sortBy==='exp')list=[...list].sort((a,b)=>(minPrice(b)||-1)-(minPrice(a)||-1));
  $('count').textContent=list.length?`${list.length.toLocaleString('fa-IR')} کالا`:'';
  $('grid').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="status">هیچ کالایی پیدا نشد. دسته، فیلتر یا عبارت جستجو را تغییر دهید.</div>';
  applyFilterUI();
}
function clearFilters(){filt={min:0,max:0,disc:false,brand:''};$('f-min').value='';$('f-max').value='';$('f-disc').checked=false;$('f-brand').value='';render();}
function setCategory(c){cat=CATS.some(x=>x.n===norm(c))?norm(c):'همه';buildNav();render();}
async function loadProducts(){
  $('grid').innerHTML='<div class="status">در حال بارگذاری کالاها…</div>';
  try{
    if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase client unavailable');
    const client=window.supabase.createClient('https://fermurffpsawrpulsxun.supabase.co','GAPGPTMASKTOKENxk3son76c0eX0X');
    const {data,error}=await client.from('products').select('*').order('id',{ascending:false});
    if(error)throw error;
    all=data||[];buildBrandOptions();render();
  }catch(err){console.error(err);$('grid').innerHTML='<div class="status">خطا در بارگذاری محصولات. اتصال، پیکربندی پایگاه داده یا کلید دسترسی را بررسی کنید.</div>';}
}
$('fbtn').addEventListener('click',()=>$('filters').classList.toggle('hide'));
$('clear-filter').addEventListener('click',clearFilters);
$('f-brand').addEventListener('change',e=>{filt.brand=e.target.value;render();});
$('f-min').addEventListener('input',e=>{filt.min=toNum(e.target.value);render();});
$('f-max').addEventListener('input',e=>{filt.max=toNum(e.target.value);render();});
$('f-disc').addEventListener('change',e=>{filt.disc=e.target.checked;render();});
$('q').addEventListener('input',e=>{query=e.target.value.trim();render();});
document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){setCategory(c.dataset.cat);return;}const s=e.target.closest('#sort button');if(s){sortBy=s.dataset.s;document.querySelectorAll('#sort button').forEach(b=>b.classList.toggle('active',b===s));render();return;}if(e.target.closest('[data-home]')){e.preventDefault();cat='همه';query='';$('q').value='';buildNav();render();window.scrollTo({top:0,behavior:'smooth'});}});
buildNav();loadProducts();
</script>
</body>
</html>
