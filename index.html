
<script>
(() => {
  const phone = '09055526197';
  const phoneLink = 'tel:+989055526197';
  const address = 'مشهد، بین توس ۱۰۲ و ۱۰۴';
  const mapUrl = 'https://neshan.org/maps/@36.40235110106153,59.50645983688901,15.0z,0.0p';
  const workingHours = 'همه‌روزه: ۹ تا ۱۳ — ۱۷ تا ۲۲';

  /* افزودن بخش اطلاعات فروشگاه به صفحه اصلی */
  const home = document.getElementById('home');

  if (home && !document.getElementById('store-info-added')) {
    const section = document.createElement('section');
    section.id = 'store-info-added';
    section.className = 'store-info';

    section.innerHTML = `
      <h2>🏬 اطلاعات فروشگاه مجلل</h2>
      <p>
        برای مشاهده، بررسی کالا، پرسیدن قیمت و اطلاع از موجودی،
        می‌توانید به‌صورت حضوری به فروشگاه مراجعه کنید یا تماس بگیرید.
      </p>

      <div class="store-details">
        <div class="store-detail">
          <b>📍 آدرس فروشگاه</b>
          ${address}
        </div>

        <div class="store-detail">
          <b>🕒 ساعت کاری</b>
          ${workingHours}
        </div>

        <div class="store-detail">
          <b>☎️ شماره تماس</b>
          ${phone}
        </div>

        <div class="store-detail">
          <b>🛍️ روش خرید</b>
          خرید فقط به‌صورت حضوری از فروشگاه
        </div>
      </div>

      <div class="store-buttons">
        <a class="call-store" href="${phoneLink}">☎️ تماس با فروشگاه</a>
        <a class="map-store" href="${mapUrl}" target="_blank" rel="noopener noreferrer">📍 مسیریابی با نشان</a>
      </div>

      <div class="rules-box">
        <h3>قوانین خرید حضوری</h3>
        <ul>
          <li>امکان مشاهده و بررسی کالا قبل از خرید وجود دارد.</li>
          <li>لطفاً پیش از مراجعه برای اطلاع از موجودی کالا تماس بگیرید.</li>
          <li>قیمت و موجودی بعضی کالاها ممکن است به‌روزرسانی شود.</li>
          <li>تحویل کالا در محل فروشگاه انجام می‌شود.</li>
        </ul>
      </div>
    `;

    home.appendChild(section);
  }

  /* افزودن دکمه تماس به صفحه هر محصول */
  function addProductCallButton() {
    const actionBox = document.getElementById('d-action');

    if (!actionBox || actionBox.querySelector('.quick-call')) return;

    const call = document.createElement('a');
    call.className = 'quick-call';
    call.href = phoneLink;
    call.innerHTML = '☎️ تماس برای استعلام موجودی';
    actionBox.parentNode.insertBefore(call, actionBox);
  }

  /* تغییر متن بخش ارتباط در صفحه محصول */
  function updateProductContactText() {
    const contactTitle = document.querySelector('.contact-h');

    if (contactTitle) {
      contactTitle.textContent = 'برای پرسیدن موجودی و قیمت تماس بگیرید';
    }
  }

  /* افزودن شماره تماس و نقشه به فوتر */
  function updateFooter() {
    const footerWrap = document.querySelector('footer .wrap');

    if (!footerWrap || document.getElementById('footer-store-contact')) return;

    const info = document.createElement('div');
    info.id = 'footer-store-contact';
    info.style.marginTop = '14px';
    info.style.lineHeight = '2';
    info.innerHTML = `
      <div>📍 ${address}</div>
      <div>🕒 ${workingHours}</div>
      <div>
        ☎️ <a href="${phoneLink}" style="color:#e5c158;text-decoration:none;font-weight:800">${phone}</a>
        &nbsp; | &nbsp;
        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" style="color:#e5c158;text-decoration:none;font-weight:800">مسیریابی</a>
      </div>
    `;

    footerWrap.appendChild(info);
  }

  /* صفحه محصول بعد از کلیک و باز شدن ساخته می‌شود؛ با observer دکمه تماس اضافه می‌شود */
  const observer = new MutationObserver(() => {
    addProductCallButton();
    updateProductContactText();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  updateFooter();
})();
</script>
