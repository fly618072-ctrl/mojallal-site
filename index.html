<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فروشگاه مجلل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px; box-shadow: 2px 2px 5px #ccc; }
        h1 { color: #333; text-align: center; }
    </style>
</head>
<body>
    <h1>محصولات فروشگاه مجلل</h1>
    <div id="app">در حال بارگذاری محصولات...</div>

    <script>
        const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
        
        // فقط کلیدی که در بخش anon/public بود را اینجا پیست کن
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcm11cmZmcHNhd3JwdWxzeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODkzODYsImV4cCI6MjEwNjk2NTM4Nn0.abW-PkWxNsybuDdmaf4PieW9kc1NPqjTdME9_DyAByg';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchProducts() {
            const app = document.getElementById('app');
            try {
                const { data, error } = await supabase.from('products').select('*');
                if (error) { app.innerHTML = `<p style="color:red;">خطا: ${error.message}</p>`; return; }
                if (!data || data.length === 0) { app.innerHTML = '<p>محصولی یافت نشد.</p>'; return; }
                app.innerHTML = '';
                data.forEach(p => {
                    app.innerHTML += `<div class="product-card"><h2>${p.title}</h2><p>قیمت: ${p.price ? p.price.toLocaleString('fa-IR') : '۰'} تومان</p><p>${p.description || ''}</p></div>`;
                });
            } catch (err) { app.innerHTML = '<p style="color:red;">خطای سیستمی رخ داد.</p>'; }
        }
        fetchProducts();
    </script>
</body>
</html>
