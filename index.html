<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه مجلل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1c;
            --card-hover: #252525;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f5f5f5;
            --text-muted: #aaa;
            --border-color: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            font-family: Tahoma, 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px 15px;
            text-align: center;
        }

        header h1 {
            color: var(--gold);
            margin: 10px 0 5px;
            font-size: 1.8rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .category-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--gold);
            color: #000;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: right;
        }

        /* کارت آگهی شبیه دیجی‌کالا */
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        /* عکس بالای آگهی */
        .card-image-box {
            width: 100%;
            height: 190px;
            background-color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .card-image-box img {
            transform: scale(1.05);
        }

        .no-image {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* محتوای زیر عکس */
        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-category {
            color: var(--gold);
            font-size: 0.75rem;
            margin-bottom: 6px;
        }

        .card-title {
            color: var(--text-light);
            font-size: 0.95rem;
            margin: 0 0 12px;
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-price {
            color: var(--gold-light);
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: auto;
            text-align: left;
            direction: ltr;
        }

        .card-price span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: normal;
            margin-right: 4px;
        }

        /* وضعیت بارگذاری و خطا */
        .status-message {
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* پنجره مشخصات (Modal جزئیات محصول مثل دیجی‌کالا) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 14px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 24px;
            text-align: right;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: transparent;
            border: none;
            color: #bbb;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-image-wrap {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-image-wrap img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
        }

        .modal-title {
            color: var(--gold-light);
            font-size: 1.3rem;
            margin: 0 0 10px;
        }

        .modal-price {
            font-size: 1.25rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .modal-section-title {
            color: var(--gold);
            font-size: 0.95rem;
            margin: 15px 0 8px;
        }

        .modal-desc {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
            background: #141414;
            padding: 12px;
            border-radius: 8px;
        }

        .modal-specs {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .spec-item {
            background: #171717;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .spec-key {
            color: var(--text-muted);
        }

        .spec-val {
            color: var(--gold-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>فروشگاه مجلل</h1>
        <p>مشاهده، بررسی و انتخاب آنلاین آگهی‌ها و کالاها</p>
    </header>

    <div class="category-filters">
        <button class="filter-btn active" onclick="loadProducts('all', this)">همه محصولات</button>
        <button class="filter-btn" onclick="loadProducts('موبایل', this)">موبایل</button>
        <button class="filter-btn" onclick="loadProducts('لوازم خانگی', this)">لوازم خانگی</button>
        <button class="filter-btn" onclick="loadProducts('سرویس چوب', this)">سرویس چوب</button>
    </div>

    <div id="productsGrid" class="products-grid">
        <div class="status-message">در حال دریافت کالاها...</div>
    </div>

    <!-- پاپ‌آپ نمایش جزئیات و مشخصات آگهی -->
    <div id="productModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ۱. اتصال به پایگاه‌داده سوپابیس
        const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcm11cmZmcHNhd3JwdWxzeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODkzODYsImV4cCI6MjEwNjk2NTM4Nn0.abW-PkWxNsybuDdmaf4PieW9kc1NPqjTdME9_DyAByg'; // <--- کلید anon خودت را اینجا بگذار
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProductsCache = [];

        // ۲. دریافت و بارگذاری آگهی‌ها
        async function loadProducts(category = 'all', btnElement = null) {
            const grid = document.getElementById('productsGrid');

            if (btnElement) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            grid.innerHTML = '<div class="status-message">در حال بارگذاری...</div>';

            try {
                let query = supabaseClient.from('products').select('*');

                if (category !== 'all') {
                    query = query.eq('category', category);
                }

                const { data, error } = await query;

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="status-message">هیچ آگهی در این دسته موجود نیست.</div>';
                    return;
                }

                allProductsCache = data;
                renderProducts(data);
            } catch (err) {
                grid.innerHTML = `<div class="status-message" style="color: #ff6b6b;">خطا: ${err.message}</div>`;
            }
        }

        // ۳. ساخت کارت‌ها (عکس بالا، قیمت پایین)
        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = items.map((item, index) => {
                const title = item.title || 'بدون عنوان';
                const price = item.price ? Number(item.price).toLocaleString('fa-IR') : 'تماس بگیرید';
                const cat = item.category || 'متفرقه';
                const imageTag = item.image_url 
                    ? `<img src="${item.image_url}" alt="${title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>تصویر در دسترس نیست</div>'">` 
                    : `<div class="no-image">بدون تصویر</div>`;

                return `
                    <div class="product-card" onclick="openDetails(${index})">
                        <div class="card-image-box">
                            ${imageTag}
                        </div>
                        <div class="card-content">
                            <span class="card-category">${cat}</span>
                            <h3 class="card-title">${title}</h3>
                            <div class="card-price">${price} <span>تومان</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ۴. باز کردن جزئیات کامل و مشخصات با کلیک روی آگهی
        function openDetails(index) {
            const item = allProductsCache[index];
            if (!item) return;

            const modal = document.getElementById('productModal');
            const modalBody = document.getElementById('modalBody');

            const title = item.title || 'بدون عنوان';
            const price = item.price ? Number(item.price).toLocaleString('fa-IR') + ' تومان' : 'توافقی / تماس بگیرید';
            const desc = item.description || 'توضیحاتی برای این آگهی ثبت نشده است.';
            const specs = item.specs || 'مشخصاتی ثبت نشده است.';

            modalBody.innerHTML = `
                ${item.image_url ? `<div class="modal-image-wrap"><img src="${item.image_url}" alt="${title}"></div>` : ''}
                <h2 class="modal-title">${title}</h2>
                <div class="modal-price">${price}</div>
                
                <div class="modal-section-title">توضیحات آگهی</div>
                <div class="modal-desc">${desc}</div>

                <div class="modal-section-title">مشخصات فنی و جزئیات</div>
                <div class="modal-specs">
                    <div class="spec-item"><span class="spec-key">دسته‌بندی:</span><span class="spec-val">${item.category || '-'}</span></div>
                    <div class="spec-item"><span class="spec-key">مشخصات کالا:</span><span class="spec-val">${specs}</span></div>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'productModal') {
                closeModal();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // بارگذاری اولیه
        loadProducts('all');
    </script>
</body>
</html>
