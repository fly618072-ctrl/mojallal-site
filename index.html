<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">فروشگاه مجلل | خرید حضوری محصولات</title>
    <meta id="meta-desc" name="description" content="فروشگاه مجلل - مرجع خرید حضوری با بهترین کیفیت و قیمت مناسب در مشهد.">
    
    <!-- OpenGraph Meta Tags for Dynamic Sharing -->
    <meta id="og-title" property="og:title" content="فروشگاه مجلل">
    <meta id="og-desc" property="og:description" content="خرید حضوری محصولات با کیفیت در فروشگاه مجلل">
    <meta id="og-image" property="og:image" content="">
    <meta id="og-url" property="og:url" content="">

    <!-- Google Fonts: Vazirmatn & Estedad -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/edad-font@v1.0.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            500: '#d4af37',
                            600: '#aa8c2c',
                            700: '#806921'
                        }
                    },
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                        edad: ['Estedad', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #121212;
            color: #e5e5e5;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
        }
        .gold-border {
            border-color: #d4af37;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-black">

    <!-- HEADER / NAVBAR -->
    <header class="bg-[#1a1a1a] border-b border-gold-500/30 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="#" onclick="router.navigate('')" class="flex items-center gap-2 text-2xl font-bold text-gold-500 tracking-wider">
                <span>فروشگاه مجلل</span>
            </a>
            
            <div class="flex items-center gap-3">
                <button onclick="clearCacheAndReload()" class="text-xs bg-neutral-800 text-gold-500 hover:bg-gold-500 hover:text-black border border-gold-500/40 px-3 py-1.5 rounded-lg transition">
                    🔄 بروزرسانی محصولات
                </button>
                <div class="text-xs text-neutral-400 bg-neutral-900 px-3 py-1.5 rounded-lg border border-neutral-800">
                    📍 خرید صرفاً حضوری
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        
        <!-- VIEW 1: HOME / PRODUCT LIST -->
        <div id="view-home" class="space-y-6">
            <!-- Filter & Search Bar -->
            <div class="bg-[#1a1a1a] p-4 rounded-xl border border-gold-500/20 shadow-md flex flex-col md:flex-row gap-4 items-center justify-between">
                <input type="text" id="search-input" placeholder="جستجوی محصول..." class="w-full md:w-1/3 bg-neutral-900 border border-neutral-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-gold-500 transition">
                <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="category-filters">
                    <button onclick="filterCategory('all')" class="cat-btn active bg-gold-500 text-black px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition">همه</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Loaded dynamically -->
                <div class="col-span-full text-center py-12 text-neutral-400">در حال بارگذاری محصولات...</div>
            </div>
        </div>

        <!-- VIEW 2: PRODUCT DETAIL -->
        <div id="view-detail" class="hidden space-y-6">
            <button onclick="router.navigate('')" class="inline-flex items-center gap-2 bg-neutral-800 text-gold-500 hover:bg-gold-500 hover:text-black px-4 py-2 rounded-lg border border-gold-500/30 transition text-sm font-medium">
                ← بازگشت به لیست محصولات
            </button>
            
            <div id="product-detail-content" class="bg-[#1a1a1a] border border-gold-500/20 rounded-2xl p-6 md:p-8 shadow-xl">
                <!-- Detail content loaded dynamically -->
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-[#1a1a1a] border-t border-gold-500/30 py-6 mt-12 text-center text-sm text-neutral-400">
        <div class="max-w-7xl mx-auto px-4 space-y-2">
            <p>© تمامی حقوق برای <span class="text-gold-500 font-bold">فروشگاه مجلل</span> محفوظ است. (خرید حضوری)</p>
            <p class="text-xs text-neutral-500">مشهد - مراجعه فقط با هماهنگی حضوری</p>
        </div>
    </footer>

    <!-- APP SCRIPT -->
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let currentCategory = 'all';

        // --- CACHING MECHANISM (8 Minutes TTL) ---
        const CACHE_KEY = 'mojallal_products_cache';
        const CACHE_TIME_KEY = 'mojallal_cache_time';
        const CACHE_TTL = 8 * 60 * 1000; // 8 minutes

        async function fetchProductsFromSupabase() {
            const now = Date.now();
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

            if (cachedData && cachedTime && (now - cachedTime < CACHE_TTL)) {
                try {
                    return JSON.parse(cachedData);
                } catch (e) {
                    console.error('Error parsing cache', e);
                }
            }

            // Fetch fresh data
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Supabase fetch error:', error);
                // Fallback to expired cache if available
                if (cachedData) return JSON.parse(cachedData);
                return [];
            }

            if (data) {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, now);
            }
            return data || [];
        }

        function clearCacheAndReload() {
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CACHE_TIME_KEY);
            initApp();
        }

        // --- ROUTER SYSTEM WITH HASH (#p-ID) & META TAG UPDATING ---
        const router = {
            init: async () => {
                allProducts = await fetchProductsFromSupabase();
                renderCategories();
                window.addEventListener('hashchange', router.handleRoute);
                router.handleRoute();
            },
            navigate: (hash) => {
                window.location.hash = hash;
            },
            handleRoute: () => {
                const hash = window.location.hash;
                const homeView = document.getElementById('view-home');
                const detailView = document.getElementById('view-detail');

                if (hash.startsWith('#p-')) {
                    const productId = hash.replace('#p-', '');
                    const product = allProducts.find(p => p.id == productId);
                    
                    if (product) {
                        homeView.classList.add('hidden');
                        detailView.classList.remove('hidden');
                        renderProductDetail(product);
                        updateMetaTags(product.title, product.description, product.image_url, window.location.href);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        return;
                    }
                }

                // Default to Home View
                detailView.classList.add('hidden');
                homeView.classList.remove('hidden');
                renderProducts(allProducts);
                updateMetaTags('فروشگاه مجلل | خرید حضوری محصولات', 'فروشگاه مجلل - مرجع خرید حضوری با بهترین کیفیت و قیمت مناسب در مشهد.', '', window.location.origin);
            }
        };

        function updateMetaTags(title, desc, image, url) {
            document.getElementById('page-title').innerText = title;
            document.getElementById('meta-desc').setAttribute('content', desc);
            document.getElementById('og-title').setAttribute('content', title);
            document.getElementById('og-desc').setAttribute('content', desc);
            if (image) document.getElementById('og-image').setAttribute('content', image);
            document.getElementById('og-url').setAttribute('content', url);
        }

        // --- RENDERING FUNCTIONS ---
        function renderCategories() {
            const categories = ['all', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('category-filters');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="cat-btn ${cat === currentCategory ? 'bg-gold-500 text-black font-bold' : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700'} px-4 py-2 rounded-lg text-sm whitespace-nowrap transition">
                    ${cat === 'all' ? 'همه' : cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategories();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesQuery = p.title.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
                return matchesCat && matchesQuery;
            });
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-neutral-400">محصولی یافت نشد.</div>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="bg-[#1a1a1a] border border-gold-500/20 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-gold-500/50 transition group">
                    <div>
                        <div class="h-48 overflow-hidden bg-neutral-900 relative">
                            <img src="${p.image_url || 'https://via.placeholder.com/400x300?text=Majallal'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="p-4 space-y-2">
                            <span class="text-xs bg-gold-500/10 text-gold-500 px-2 py-1 rounded border border-gold-500/20">${p.category || 'عمومی'}</span>
                            <h3 class="font-bold text-lg text-white line-clamp-1">${p.title}</h3>
                            <p class="text-neutral-400 text-sm line-clamp-2">${p.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between mt-4">
                        <span class="text-gold-500 font-bold">${Number(p.price || 0).toLocaleString()} تومان</span>
                        <button onclick="router.navigate('p-${p.id}')" class="bg-gold-500 hover:bg-gold-600 text-black font-medium px-4 py-2 rounded-lg text-sm transition">
                            مشاهده و جزئیات
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderProductDetail(p) {
            const container = document.getElementById('product-detail-content');
            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    <div class="rounded-xl overflow-hidden bg-neutral-900 border border-gold-500/20 h-80 md:h-96">
                        <img src="${p.image_url || 'https://via.placeholder.com/600x400?text=Majallal'}" alt="${p.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="space-y-4">
                        <span class="text-xs bg-gold-500/10 text-gold-500 px-3 py-1 rounded-full border border-gold-500/20">${p.category || 'عمومی'}</span>
                        <h1 class="text-2xl md:text-3xl font-bold text-white">${p.title}</h1>
                        <p class="text-neutral-300 leading-relaxed text-sm md:text-base">${p.description || 'توضیحات تکمیلی برای این محصول ثبت نشده است.'}</p>
                        
                        <div class="pt-4 border-t border-neutral-800 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-neutral-400 block">قیمت محصول:</span>
                                <span class="text-xl md:text-2xl font-bold text-gold-500">${Number(p.price || 0).toLocaleString()} تومان</span>
                            </div>
                            <div class="text-left bg-neutral-900 px-4 py-2 rounded-lg border border-gold-500/30">
                                <span class="text-xs text-gold-400 block font-bold">نوع خرید:</span>
                                <span class="text-xs text-white">فقط مراجعه حضوری</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Event listener for search
        document.getElementById('search-input').addEventListener('input', applyFilters);

        // Run app on load
        window.addEventListener('DOMContentLoaded', router.init);
    </script>
</body>
</html>
