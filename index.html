<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه مجلل | خرید موبایل، لوازم خانگی و مبلمان</title>
    <meta name="description" content="فروشگاه اینترنتی مجلل مارکت - عرضه انواع گوشی موبایل، لوازم خانگی و سرویس چوب با بهترین قیمت">
    <meta name="keywords" content="مجلل مارکت, فروشگاه مجلل, خرید موبایل, لوازم خانگی, مبلمان">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1220;
            --card: #151e31;
            --card-hover: #1c2842;
            --gold: #fbbf24;
            --gold-dark: #d97706;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #2b3a55;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        /* هدر */
        header {
            background: linear-gradient(180deg, #111a2e, var(--bg));
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        header h1 {
            margin: 0;
            color: var(--gold);
            font-size: 1.6rem;
        }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }

        /* جستجو و دسته‌بندی */
        .toolbar {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        #search {
            flex: 1;
            min-width: 220px;
            max-width: 400px;
            padding: 11px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: #fff;
            font-family: inherit;
        }
        #search:focus { outline: none; border-color: var(--gold); }
        .cat-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            font-weight: bold;
        }

        /* گرید محصولات */
        .grid {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
            box-shadow: 0 12px 24px rgba(0,0,0,0.45);
        }
        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #0f172a;
        }
        .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
        .card-title {
            font-size: 0.95rem;
            margin: 0 0 10px;
            line-height: 1.6;
            flex: 1;
        }
        .card-price { color: var(--gold); font-weight: bold; font-size: 1.05rem; }
        .card-price small { color: var(--muted); font-weight: normal; font-size: 0.75rem; }

        /* مودال جزئیات */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 760px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--border);
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 640px) { .modal-grid { grid-template-columns: 1fr; } }
        .modal img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            background: #0f172a;
        }
        .modal h2 { color: var(--gold); margin-top: 0; font-size: 1.25rem; line-height: 1.6; }
        .modal-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--gold);
            margin: 10px 0;
        }
        .modal-price small { color: var(--muted); font-size: 0.8rem; font-weight: normal; }
        .modal-desc { color: #cbd5e1; line-height: 1.9; font-size: 0.9rem; }

        /* رنگ‌ها */
        .colors-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
        .colors-label { font-size: 0.85rem; color: var(--muted); width: 100%; }
        .color-swatch {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #fff;
            text-shadow: 0 1px 2px #000;
        }
        .color-swatch.active {
            border-color: var(--gold);
            transform: scale(1.12);
            box-shadow: 0 0 0 3px rgba(251,191,36,0.3);
        }
        .color-name { font-size: 0.85rem; color: #e2e8f0; }

        /* جدول مشخصات */
        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 0.88rem;
        }
        .specs-table td {
            padding: 9px 6px;
            border-bottom: 1px solid var(--border);
        }
        .specs-table td:first-child { color: var(--muted); }
        .specs-table td:last-child { color: #e2e8f0; text-align: left; }

        .order-btn {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .order-btn:hover { background: var(--gold-dark); }

        .empty-msg { text-align: center; color: var(--muted); grid-column: 1/-1; padding: 40px 0; }
        #loading { text-align: center; color: var(--muted); padding: 60px 0; }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<header>
    <h1>🏆 فروشگاه مجلل</h1>
    <p>خرید مطمئن موبایل، لوازم خانگی و مبلمان</p>
</header>

<div class="toolbar">
    <input type="text" id="search" placeholder="🔍 جستجوی محصول..." oninput="renderProducts()">
    <button class="cat-btn active" onclick="setCategory('all', this)">همه</button>
    <button class="cat-btn" onclick="setCategory('موبایل', this)">موبایل</button>
    <button class="cat-btn" onclick="setCategory('لوازم خانگی', this)">لوازم خانگی</button>
    <button class="cat-btn" onclick="setCategory('مبلمان', this)">مبلمان</button>
</div>

<div class="grid" id="products-grid">
    <div id="loading">در حال بارگذاری محصولات...</div>
</div>

<!-- مودال جزئیات محصول -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div id="modal-content"></div>
    </div>
</div>

<footer>فروشگاه مجلل © ۱۴۰۴ — تمامی حقوق محفوظ است.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cnKr9_hRibLAttI-SkKoMA_cIbYIiWv'; // کلید anon شما
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let currentCategory = 'all';
    let selectedColorIdx = 0;

    /* ---------- رنگ‌ها: تبدیل نام فارسی به کد رنگ ---------- */
    const colorMap = {
        'مشکی': '#111111', 'سیاه': '#111111',
        'سفید': '#f5f5f5',
        'نقره‌ای': '#c0c0c0', 'نقره ای': '#c0c0c0',
        'طلایی': '#d4af37', 'گلد': '#d4af37',
        'آبی': '#1d4ed8',
        'سرمه‌ای': '#1e293b', 'سرمه ای': '#1e293b',
        'قرمز': '#dc2626',
        'سبز': '#16a34a',
        'بنفش': '#7e22ce',
        'خاکستری': '#6b7280',
        'صورتی': '#ec4899',
        'زرد': '#eab308',
        'نارنجی': '#ea580c',
        'قهوه‌ای': '#78350f', 'قهوه ای': '#78350f',
        'بژ': '#d9c8a9',
        'سبز یشمی': '#2e8b57',
        'آبی آسمانی': '#38bdf8',
        'تیتانیوم': '#8a8d91',
        'برنز': '#b08d57',
        'کرم': '#f0e6d2'
    };

    function getColorCode(name) {
        if (name.includes('|')) return name.split('|')[1].trim(); // کد دستی بعد از |
        return colorMap[name.trim()] || '#555b66';
    }
    function getColorName(raw) {
        return raw.split('|')[0].split(':')[0].trim();
    }
    function getColorPrice(raw, basePrice) {
        const m = raw.split(':');
        if (m.length > 1 && !isNaN(parseInt(m[1]))) return parseInt(m[1]);
        return basePrice;
    }

    /* ---------- آیکون‌های مشخصات ---------- */
    const specIcons = [
        ['باتری', '🔋'], ['شارژ', '⚡'],
        ['دوربین', '📷'],
        ['رم', '🧠'], ['حافظه', '💾'], ['گيگابايت', '💾'],
        ['صفحه', '📱'], ['نمایشگر', '🖥️'],
        ['پردازنده', '⚙️'], ['تراشه', '⚙️'], ['سی پی یو', '⚙️'],
        ['وزن', '⚖️'], ['ابعاد', '📏'],
        ['گارانتی', '🛡️'], ['اصالت', '🛡️'],
        ['شبکه', '📶'], ['سیم', '📶'],
        ['کیفیت', '⭐'], ['جنس', '🧵'],
        ['رنگ', '🎨']
    ];
    function getSpecIcon(text) {
        for (const [key, icon] of specIcons) {
            if (text.includes(key)) return icon;
        }
        return '🔹';
    }

    /* ---------- بارگذاری محصولات ---------- */
    async function loadProducts() {
        try {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;
            allProducts = data || [];
            renderProducts();
        } catch (e) {
            document.getElementById('products-grid').innerHTML =
                '<div class="empty-msg">⚠️ خطا در بارگذاری: ' + e.message + '</div>';
        }
    }

    function formatPrice(n) {
        return Number(n).toLocaleString('fa-IR');
    }

    /* ---------- نمایش کارت‌ها ---------- */
    function renderProducts() {
        const term = document.getElementById('search').value.trim();
        const grid = document.getElementById('products-grid');
        let list = allProducts;

        if (currentCategory !== 'all') {
            list = list.filter(p => (p.description || '').includes(currentCategory) || (p.title || '').includes(currentCategory));
        }
        if (term) {
            list = list.filter(p => (p.title || '').includes(term));
        }

        if (list.length === 0) {
            grid.innerHTML = '<div class="empty-msg">هنوز محصولی ثبت نشده است.</div>';
            return;
        }

        grid.innerHTML = list.map(p => {
            const colorsRaw = p.colors ? p.colors.split(',').map(c => c.trim()).filter(Boolean) : [];
            const dots = colorsRaw.slice(0, 4).map(c =>
                `<span style="display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid #666;background:${getColorCode(getColorName(c))};margin-left:3px"></span>`
            ).join('');
            return `
            <div class="card" onclick="openModal(${p.id})">
                <img src="${p.image_url || ''}" alt="${p.title || ''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22190%22%3E%3Crect fill=%22%230f172a%22 width=%22100%25%22 height=%22100%25%22/%3E%3C/svg%3E'">
                <div class="card-body">
                    <h3 class="card-title">${p.title || 'بدون عنوان'}</h3>
                    <div>${dots}</div>
                    <div class="card-price">${formatPrice(p.price)} <small>تومان</small></div>
                </div>
            </div>`;
        }).join('');
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts();
    }

    /* ---------- مودال جزئیات ---------- */
    function openModal(id) {
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        selectedColorIdx = 0;

        const colorsRaw = p.colors ? p.colors.split(',').map(c => c.trim()).filter(Boolean) : [];
        const specsArr = p.specs ? p.specs.split('\n').map(s => s.trim()).filter(Boolean) : [];

        const colorsHtml = colorsRaw.length ? `
            <div class="colors-row">
                <span class="colors-label">رنگ: <b class="color-name" id="color-name"></b></span>
                ${colorsRaw.map((c, i) => `
                    <div class="color-swatch ${i === 0 ? 'active' : ''}"
                         style="background:${getColorCode(getColorName(c))}"
                         title="${getColorName(c)}"
                         onclick="selectColor(${i}, this)">${getColorName(c).slice(0, 4)}</div>
                `).join('')}
            </div>` : '';

        const specsHtml = specsArr.length ? `
            <table class="specs-table">
                ${specsArr.map(s => {
                    const parts = s.split(':');
                    const key = parts[0].trim();
                    const val = parts.slice(1).join(':').trim();
                    return `<tr><td>${getSpecIcon(s)} ${key}</td><td>${val}</td></tr>`;
                }).join('')}
            </table>` : '';

        const descHtml = p.description ? `<p class="modal-desc">${p.description}</p>` : '';

        document.getElementById('modal-content').innerHTML = `
            <div class="modal-grid">
                <div>
                    <img src="${p.image_url || ''}" alt="${p.title || ''}">
                </div>
                <div>
                    <h2>${p.title || 'بدون عنوان'}</h2>
                    <div class="modal-price"><span id="modal-price-num">${formatPrice(getColorPrice(colorsRaw[0] || '', p.price))}</span> <small>تومان</small></div>
                    ${colorsHtml}
                    ${descHtml}
                    ${specsHtml}
                    <button class="order-btn" onclick="orderProduct('${(p.title || '').replace(/'/g, '')}', ${p.id})">🛒 ثبت سفارش / استعلام موجودی</button>
                </div>
            </div>`;

        if (colorsRaw.length) updateColorName(colorsRaw, 0);
        document.getElementById('modal-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function updateColorName(colorsRaw, idx) {
        const el = document.getElementById('color-name');
        if (el) el.innerText = getColorName(colorsRaw[idx]);
    }

    function selectColor(idx, el) {
        const p = allProducts.find(x => x.id === currentModalId());
        selectedColorIdx = idx;
        const colorsRaw = p.colors ? p.colors.split(',').map(c => c.trim()).filter(Boolean) : [];
        const price = getColorPrice(colorsRaw[idx], p.price);

        document.getElementById('modal-price-num').innerText = formatPrice(price);
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        updateColorName(colorsRaw, idx);
    }

    function currentModalId() {
        // ذخیره شناسه محصول باز شده
        return window._openProductId;
    }

    const _origOpenModal = openModal;
    openModal = function (id) {
        window._openProductId = id;
        _origOpenModal(id);
    };

    function orderProduct(title) {
        const phone = '09055526197'; // شماره تماس خودت را اینجا بگذار
        alert(`برای سفارش «${title}» لطفاً با شماره ${phone} تماس بگیرید یا در تلگرام پیام دهید.`);
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = 'auto';
    }

    loadProducts();
</script>
</body>
</html>
