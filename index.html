<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>فروشگاه مجلل</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #151518;
      --surface-2: #1e1e24;
      --line: rgba(255, 255, 255, 0.08);
      --gold: #d4af37;
      --text: #f0f0f3;
      --text-muted: #8e8e99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(10px);
    }
    .nav-container {
      max-width: 1200px; margin: 0 auto;
      padding: 18px 20px;
      display: flex; justify-content: center; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--gold); }
    .brand-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

    .categories-bar {
      max-width: 1200px; margin: 24px auto 16px; padding: 0 20px;
      display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--surface); border: 1px solid var(--line); color: var(--text-muted);
      padding: 8px 18px; border-radius: 30px; font-size: 14px; cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

    main { max-width: 1200px; margin: 0 auto; padding: 10px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(212, 175, 55, 0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .card-img-wrapper { width: 100%; height: 200px; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .card:hover .card-img { transform: scale(1.05); }
    .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-cat { font-size: 11px; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .card-price { font-size: 16px; font-weight: 800; color: #fff; }
    .card-price span { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    .status-box { text-align: center; padding: 60px 20px; color: var(--text-muted); }

    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-window {
      background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
      width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; left: 16px; background: rgba(255, 255, 255, 0.08);
      border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;
    }
    .detail-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: #0a0a0c; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <span style="font-size: 26px;">👑</span>
        <span class="brand-title">فروشگاه مجلل</span>
      </a>
    </div>
  </header>

  <div class="categories-bar">
    <button class="cat-btn active" onclick="filterCategory('همه', this)">همه کالاها</button>
    <button class="cat-btn" onclick="filterCategory('موبایل', this)">📱 موبایل</button>
    <button class="cat-btn" onclick="filterCategory('لوازم خانگی', this)">🏠 لوازم خانگی</button>
    <button class="cat-btn" onclick="filterCategory('سرویس چوب', this)">🛋️ سرویس چوب</button>
  </div>

  <main>
    <div id="product-grid" class="grid"></div>
    <div id="loading" class="status-box">در حال بارگذاری آگهی‌ها...</div>
  </main>

  <div id="detail-modal" class="modal-backdrop" onclick="if(event.target.id==='detail-modal') closeModal()">
    <div class="modal-window">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="detail-img" class="detail-img" src="" alt="محصول">
      <h2 id="detail-title" style="margin-bottom: 10px; font-size: 20px;"></h2>
      <div id="detail-price" style="font-size: 20px; color: var(--gold); font-weight: 800; margin-bottom: 16px;"></div>
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">توضیحات:</div>
      <p id="detail-desc" style="line-height: 1.8; font-size: 14px; color: #ddd;"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cnKr9_hRibLAttI-SkKoMA_cIbYIiWv';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allProducts = [];
    let currentCategory = 'همه';

    function formatPrice(num) {
      if (!num) return 'توافقی';
      return Number(num).toLocaleString('fa-IR');
    }

    async function loadProducts() {
      const loading = document.getElementById('loading');
      const grid = document.getElementById('product-grid');
      loading.style.display = 'block';
      grid.innerHTML = '';

      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;
        allProducts = data || [];
        renderProducts();
      } catch (err) {
        console.error(err);
        loading.textContent = 'خطا در بارگذاری محصولات.';
      }
    }

    function renderProducts() {
      const loading = document.getElementById('loading');
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'همه'
        ? allProducts
        : allProducts.filter(p => (p.category || '').trim() === currentCategory);

      loading.style.display = 'none';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="status-box" style="grid-column: 1/-1;">هیچ آگهی‌ای در این دسته یافت نشد.</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const img = p.image_url || 'https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=600';
        
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img class="card-img" src="${img}" alt="${p.title}" loading="lazy">
          </div>
          <div class="card-content">
            <div>
              <div class="card-cat">${p.category || 'متفرقه'}</div>
              <h3 class="card-title">${p.title}</h3>
            </div>
            <div class="card-price">
              ${formatPrice(p.price)} <span>تومان</span>
            </div>
          </div>
        `;
        card.onclick = () => showDetail(p);
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function showDetail(p) {
      document.getElementById('detail-img').src = p.image_url || '';
      document.getElementById('detail-title').textContent = p.title;
      document.getElementById('detail-price').textContent = `${formatPrice(p.price)} تومان`;
      document.getElementById('detail-desc').textContent = p.description || 'توضیحی ثبت نشده است.';
      document.getElementById('detail-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('open');
    }

    window.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
