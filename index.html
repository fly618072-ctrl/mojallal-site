<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:locale" content="fa_IR">
<meta property="og:title" content="فروشگاه مجلل">
<meta property="og:description" content="موبایل، لوازم خانگی و سرویس چوب را از نزدیک ببینید و همان‌جا انتخاب کنید.">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="فروشگاه مجلل">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:'Estedad Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(https://cdn.jsdelivr.net/fontsource/fonts/estedad:vf@5.3.0/arabic-wght-normal.woff2) format('woff2');src:url(https://cdn.jsdelivr.net/fontsource/fonts/estedad:vf@5.3.0/arabic-wght-normal.woff2) format('woff2') tech(variations)}
@font-face{font-family:'Estedad Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(https://cdn.jsdelivr.net/fontsource/fonts/estedad:vf@5.3.0/latin-wght-normal.woff2) format('woff2');src:url(https://cdn.jsdelivr.net/fontsource/fonts/estedad:vf@5.3.0/latin-wght-normal.woff2) format('woff2') tech(variations);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
:root{color-scheme:dark;--bg:#0e0e0e;--card:#1a1a1a;--ink:#090909;--head:#f6efdc;--em:#e5c158;--gold:#d4af37;--gold-d:#e5c158;--gold-s:#2a2310;--ivory:#f6efdc;--text:#ece8dc;--muted:#9a9488;--line:#2d2d2d;--crim:#d2343c}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Estedad Variable','Vazirmatn',Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;overflow-x:clip}
button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* Header */
header{background:var(--ink);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:20px;padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:900;font-size:22px;white-space:nowrap;text-decoration:none}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#1c1c1c;border:1px solid transparent;border-radius:12px;padding:0 14px;height:46px}
.search:focus-within{background:var(--card);border-color:var(--gold)}
.search input{flex:1;border:0;background:none;outline:0;font-size:14px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--muted)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar,.circles::-webkit-scrollbar,.strip::-webkit-scrollbar,.sort::-webkit-scrollbar{display:none}
.nav button{padding:10px 14px;font-size:13.5px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.nav button:hover{color:var(--em)}
.nav button.active{color:var(--head);font-weight:800;border-bottom-color:var(--gold)}

/* Hero */
.hero{margin-top:16px;border-radius:22px;min-height:210px;padding:34px 44px;color:var(--ivory);display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 12% 18%,rgba(233,200,120,.28),transparent 55%),repeating-linear-gradient(45deg,transparent 0 24px,rgba(214,178,96,.17) 24px 25px),repeating-linear-gradient(-45deg,transparent 0 24px,rgba(214,178,96,.17) 24px 25px),var(--ink)}
.hero::before{content:"";width:46px;height:3px;background:var(--gold);border-radius:2px}
.hero h1{font-size:32px;font-weight:900;line-height:1.5}
.hero p{font-size:15px;color:#d9d2bd;max-width:34em;line-height:1.9}

/* Category tiles */
.circles{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:22px 4px 6px;justify-content:center}
.circle{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:84px;font-size:13px;color:var(--muted)}
.circle i{width:66px;height:66px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:29px;font-style:normal;transition:.2s}
.circle:hover i{border-color:var(--gold)}
.circle.active{color:var(--head);font-weight:800}
.circle.active i{border:2px solid var(--gold);background:var(--gold-s)}

/* Latest strip */
.amazing{margin-top:20px;background:var(--ink);border:1px solid #3a321a;border-radius:18px;padding:16px;display:none}
.amazing.show{display:block}
.amazing-head{color:var(--ivory);margin-bottom:12px;padding:0 4px;font-size:17px;font-weight:800}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.strip .card{min-width:190px;max-width:190px;flex:none;border-radius:12px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:14px;margin:26px 0 12px;flex-wrap:wrap}
.sort{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.sort button{padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.sort button.active{color:var(--head);font-weight:800;border-bottom-color:var(--gold)}
.count{font-size:13px;color:var(--muted)}

/* Grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:right;min-width:0}
.card:hover .card-title{color:var(--em)}
.card:hover .thumb img{transform:scale(1.04)}
.thumb{background:#fff;border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .3s}
.card-title{font-size:13.5px;font-weight:700;line-height:1.9;height:51px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:color .2s}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:var(--gold-s);color:var(--gold-d);padding:2px 9px;border-radius:6px;font-weight:700}
.price{display:flex;align-items:baseline;gap:4px;justify-content:flex-end;font-weight:900;font-size:17px;color:var(--head)}
.price small{font-size:12px;font-weight:400;color:var(--muted)}
.status{text-align:center;padding:60px 20px;color:var(--muted);background:var(--card);grid-column:1/-1}
.skeleton{height:320px;background:linear-gradient(90deg,#1a1a1a 25%,#242424 50%,#1a1a1a 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Product page */
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:18px 0 14px;flex-wrap:wrap}
.crumbs button{color:var(--muted)}.crumbs button:hover{color:var(--em)}
.crumbs b{color:var(--text);font-weight:700}
.pdp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) minmax(0,3.6fr);gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.deal-bar{background:var(--gold-s);color:var(--gold-d);font-weight:800;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;font-size:14px}
.pimg{background:#fff;border-radius:12px;display:grid;place-items:center;min-height:360px}
.pimg img{max-width:100%;max-height:420px;object-fit:contain}
.pinfo h1{font-size:20px;font-weight:900;line-height:2;margin:6px 0 14px;color:var(--head)}
.pcat{font-size:13px;color:var(--em);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips span{background:var(--bg);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.sec h3{font-size:15px;font-weight:800;margin-bottom:10px;color:var(--head)}
.desc{font-size:14px;line-height:2.1;color:#cfc9ba;white-space:pre-line}
.buy{position:sticky;top:130px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:18px}
.buy h4{font-size:15px;margin-bottom:12px;color:var(--head)}
.seller{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.seller i{width:36px;height:36px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);display:grid;place-items:center;font-style:normal;color:#fff}
.seller small{display:block;font-size:12px;color:var(--muted)}.seller small em{font-style:normal;color:var(--em);font-weight:800}
.price-box{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin-bottom:14px}
.price-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.badge{background:var(--crim);color:#fff;border-radius:20px;padding:1px 9px;font-size:13px;font-weight:800}
.old{color:#a2aca8;text-decoration:line-through;font-size:13px}
.big{font-size:24px;font-weight:900;color:var(--head)}.big small{font-size:12px;font-weight:400;color:var(--muted)}
.btn-buy{width:100%;background:var(--gold);color:#111;border-radius:12px;padding:13px;font-weight:800;font-size:15px}
.btn-buy:hover{background:var(--em)}.btn-buy:disabled{opacity:.5;cursor:not-allowed}
.perk{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;margin-top:14px}
.perk::before{content:"🛡️"}
.ship{margin-top:12px;background:var(--bg);border-radius:10px;padding:12px;font-size:12.5px;color:#b4aea0;line-height:2}
.similar{margin-top:30px}.similar h2{font-size:17px;font-weight:800;margin-bottom:12px;color:var(--head)}
.hide{display:none!important}
.store-note{background:#241d0e;border:1px dashed var(--gold);color:var(--gold-d);border-radius:10px;padding:12px;font-size:13px;font-weight:800;text-align:center;margin-bottom:10px}
.actions{display:flex;gap:8px}
.actions button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 6px;font-size:13px;font-weight:700}
.actions button:hover{border-color:var(--gold);color:var(--gold-d)}
.actions button.on{background:var(--gold-s);border-color:var(--gold);color:var(--gold-d)}

/* Colors + features */
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);padding:3px;background:var(--card)}
.sw i{display:block;width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.sw.on{border-color:var(--gold)}
.feats{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.feats .row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 14px;font-size:13.5px;align-items:center}
.feats .row:nth-child(odd){background:#212121}
.feats .row.one{grid-template-columns:1fr}
.feats .row.extra{display:none}
.feats.open .row.extra{display:grid}
.feats dt{color:var(--muted);display:flex;gap:8px;align-items:center}
.feats dd{font-weight:700;line-height:1.8}
.more-feats{display:block;margin-top:10px;font-size:12.5px;color:var(--muted);opacity:.85}
.more-feats:hover{color:var(--em);opacity:1}

/* Compare */
.cmp-toggle{font-size:12px;color:var(--muted);padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.cmp-toggle.on{color:var(--gold-d);border-color:var(--gold);background:var(--gold-s)}
.cmpbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.1);display:flex;align-items:center;gap:12px;padding:10px 16px;z-index:60}
.cmp-items{flex:1;display:flex;gap:8px;overflow-x:auto}
.cmp-items span{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:4px 10px 4px 6px;font-size:12px;white-space:nowrap}
.cmp-items img{background:#fff;border-radius:6px;width:34px;height:34px;object-fit:contain}
.cmp-go{width:auto;padding:10px 28px}
.cmp-clear{width:34px;height:34px;border-radius:50%;background:var(--bg)}
.cmp-scroll{overflow-x:auto}
.cmp-table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px}
.cmp-table th,.cmp-table td{padding:12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;line-height:1.9}
.cmp-table th{color:var(--muted);font-weight:500;width:120px;background:#212121}
.cmp-table td img{background:#fff;border-radius:8px;width:90px;height:90px;object-fit:contain;display:block;margin-bottom:6px}
.cmp-table td button{color:var(--em);font-size:12px;font-weight:700}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);vertical-align:middle;margin-left:4px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ivory);border:1px solid var(--gold);padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:2000}
.toast.on{opacity:1}
body.has-bar{padding-bottom:70px}
.backdrop{position:fixed;inset:0;background:rgba(8,30,27,.6);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:1000;padding:14px}
.backdrop.open{display:flex}
.drawer{background:var(--card);border-radius:16px;width:100%;max-width:1000px;margin:auto;max-height:92vh;overflow-y:auto;padding:20px;position:relative}
.drawer h2{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--head)}
.drawer .x{position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;background:var(--bg)}

footer{margin-top:40px;background:var(--ink);border-top:1px solid #3a321a;padding:30px 0;text-align:center;color:#b9c7c3;font-size:13px}
footer b{display:block;color:var(--ivory);font-size:18px;font-weight:900;margin-bottom:6px}


/* Filters */
.filter-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800;color:var(--head)}
.filter-btn:hover,.filter-btn.on{border-color:var(--gold);color:var(--gold)}
#fcount{background:var(--gold);color:#111;border-radius:10px;min-width:19px;height:19px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.f-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.f-group label{font-size:12.5px;color:var(--muted)}
.f-group input{height:42px;border:1px solid var(--line);background:#1c1c1c;color:var(--text);border-radius:10px;padding:0 12px;font-size:14px;outline:0;width:100%}
.f-group input:focus{border-color:var(--gold)}
.f-check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;height:42px;cursor:pointer}
.f-check input{width:18px;height:18px;accent-color:var(--gold)}
.f-clear{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.f-clear:hover{color:var(--gold);border-color:var(--gold)}
/* Contact */
.contact-h{font-size:12.5px;color:var(--muted);margin:14px 0 8px;text-align:center}
.contact{display:flex;gap:8px}
.contact a,.sheet-links a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 6px;border-radius:10px;font-size:13px;font-weight:800;border:1px solid var(--line);color:var(--head);text-decoration:none;background:var(--card)}
.contact a:hover,.sheet-links a:hover{border-color:var(--gold);color:var(--gold)}
.ci{display:inline-block;width:10px;height:10px;border-radius:50%}.ci.r{background:#d62f8a}.ci.e{background:#ff7a00}
.sheet-bg{align-items:flex-end}
.drawer.sheet{max-width:440px;margin:0 auto;border-radius:20px 20px 0 0;border:1px solid #3a321a;border-bottom:0}
.sheet-note{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:14px}
.sheet-links{display:flex;flex-direction:column;gap:10px}
.sheet-links a{padding:15px;font-size:15px}
.foot-links{display:flex;gap:18px;justify-content:center;margin-top:14px}
.foot-links a{color:var(--gold);font-weight:800;text-decoration:none}
.pb-btn{font:inherit;cursor:pointer;text-align:center}

/* Mobile price bar (hidden on desktop) */
.top-price,.pricebar{display:none}

@media(max-width:980px){
.pdp{grid-template-columns:1fr}.buy{position:static}.pimg{min-height:260px}
.pricebar{display:flex;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;z-index:55;background:rgba(10,10,10,.98);border:1.5px solid rgba(214,178,96,.6);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px;align-items:center;gap:10px}
.pb-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;border-radius:14px;background:linear-gradient(135deg,#e0bb68,#b8893b);color:#1d1608;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.pb-btn b{font-size:15px;font-weight:900}.pb-btn small{font-size:11px;opacity:.85}
#pb-price{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;flex:none;min-height:50px;padding:5px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:14px}
#pb-price .price-row{gap:6px}
#pb-price .big{font-size:18px;color:var(--ivory);line-height:1.4}
#pb-price .big small{color:#a9bbb6}
#pb-price .old{color:rgba(246,239,220,.55)}
body.has-bar .pricebar{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
body.pdp-on{padding-bottom:104px}
}
@media(max-width:700px){
.feats .row{grid-template-columns:110px 1fr}
.hero{padding:26px 22px;min-height:170px;border-radius:18px}.hero h1{font-size:22px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:10px}.price{font-size:15px}
.circles{justify-content:flex-start}
.top{flex-wrap:wrap;gap:10px}
.search{order:3;flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a href="#" class="brand" data-act="home"><svg width="30" height="26" viewBox="0 0 28 24" fill="#b8893b" aria-hidden="true"><path d="M2 8l6 5 6-9 6 9 6-5-2 14H4z"/></svg>فروشگاه مجلل</a>
      <label class="search"><span>🔍</span><input id="q" type="search" placeholder="جستجو در فروشگاه مجلل..." autocomplete="off"></label>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main class="wrap" id="home">
  <section class="hero"><h1>بهترین کالاها با قیمت مناسب</h1><p>موبایل، لوازم خانگی و سرویس چوب را از نزدیک ببینید و همان‌جا انتخاب کنید.</p></section>
  <div class="circles" id="circles"></div>
  <section class="amazing" id="amazing"><div class="amazing-head">🔥 تازه‌ترین آگهی‌ها</div><div class="strip" id="strip"></div></section>
  <div class="toolbar">
    <button type="button" class="filter-btn" id="fbtn" data-act="toggle-filter">⚙️ فیلتر <span id="fcount" class="hide"></span></button>
