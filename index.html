<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a1a1a; color: #d4af37; text-align: center; font-family: Tahoma; }
        .grid { display: flex; justify-content: center; gap: 15px; margin: 20px; }
        .item { border: 1px solid #d4af37; padding: 10px; width: 200px; }
    </style>
</head>
<body>
    <h1>فروشگاه مجلل</h1>
    <div class="grid">
        <button onclick="load('موبایل')">موبایل</button>
        <button onclick="load('لوازم خانگی')">لوازم خانگی</button>
        <button onclick="load('سرویس چوب')">سرویس چوب</button>
    </div>
    <div id="list"></div>

    <script>
        const supabase = supabase.createClient('https://fermurffpsawrpulsxun.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcm11cmZmcHNhd3JwdWxzeHVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODkzODYsImV4cCI6MjEwNjk2NTM4Nn0.abW-PkWxNsybuDdmaf4PieW9kc1NPqjTdME9_DyAByg');

        async function load(cat) {
            const list = document.getElementById('list');
            list.innerHTML = 'در حال دریافت...';
            const { data } = await supabase.from('products').select('*').eq('category', cat);
            list.innerHTML = data.map(item => `<div class="item"><h3>${item.title}</h3><p>${item.price} تومان</p></div>`).join('');
        }
    </script>
</body>
</html>
