<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ef394e">
<title>فروشگاه مجلل</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#ef394e; --red-dark:#d32f42; --bg:#f1f2f4; --card:#fff;
  --text:#23254e; --muted:#81858b; --line:#e0e0e2; --green:#00a049;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;border:0;background:none;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* Header */
header{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:20px;padding:12px 0}
.brand{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:800;font-size:22px;white-space:nowrap;text-decoration:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:0 14px;height:46px}
.search input{flex:1;border:0;background:none;outline:0;font-size:14px;color:var(--text);min-width:0}
.search input::placeholder{color:var(--muted)}
.login{border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;white-space:nowrap}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:6px 12px;font-size:13px;color:#62666d;white-space:nowrap;border-radius:8px}
.nav button:hover{color:var(--red)}
.nav button.active{color:var(--red);font-weight:700;background:#fff0f2}

/* Hero */
.hero{margin-top:16px;border-radius:16px;min-height:200px;padding:32px 40px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;
  background:linear-gradient(115deg,#ef394e 0%,#ff6a5c 55%,#ff9a6a 100%);position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:800;line-height:1.5}
.hero p{font-size:15px;opacity:.95}
.hero::after{content:"👑";position:absolute;left:40px;bottom:-20px;font-size:150px;opacity:.18}

/* Category circles */
.circles{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:22px 4px 6px;justify-content:center}
.circles::-webkit-scrollbar{display:none}
.circle{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:84px;font-size:13px}
.circle i{width:68px;height:68px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:30px;font-style:normal;transition:.2s}
.circle:hover i,.circle.active i{border-color:var(--red);box-shadow:0 0 0 3px #ffd9de}
.circle.active{color:var(--red);font-weight:700}

/* Amazing strip */
.amazing{margin-top:20px;background:var(--red);border-radius:16px;padding:16px;display:none}
.amazing.show{display:block}
.amazing-head{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:12px;padding:0 4px}
.amazing-head b{font-size:18px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{min-width:190px;max-width:190px;flex:none}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:14px;margin:24px 0 12px;flex-wrap:wrap}
.toolbar h2{font-size:17px;margin-left:auto;margin-right:0}
.sort{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.sort button{padding:6px 12px;font-size:13px;color:var(--muted);border-radius:8px;white-space:nowrap}
.sort button.active{color:var(--red);font-weight:700}
.count{font-size:13px;color:var(--muted)}

/* Grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:right;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.14);position:relative;z-index:1}
.thumb{aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.card-title{font-size:13.5px;font-weight:600;line-height:1.9;height:51px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:#fff0f2;color:var(--red);padding:2px 8px;border-radius:6px;font-weight:600}
.price{display:flex;align-items:baseline;gap:4px;justify-content:flex-end;font-weight:800;font-size:17px}
.price small{font-size:12px;font-weight:400;color:var(--muted)}
.price.deal{color:var(--text)}
.status{text-align:center;padding:60px 20px;color:var(--muted);background:#fff;grid-column:1/-1}
.skeleton{height:320px;background:linear-gradient(90deg,#fff 25%,#f3f3f4 50%,#fff 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:14px}
.backdrop.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-close{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:16px;z-index:2}
.modal-img{background:#fff;padding:24px;display:grid;place-items:center;border-left:1px solid var(--line)}
.modal-img img{max-width:100%;max-height:360px;object-fit:contain}
.modal-info{padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.modal-info h2{font-size:19px;line-height:1.9}
.m-price{font-size:24px;font-weight:800;color:var(--red)}
.m-price small{font-size:13px;color:var(--muted);font-weight:400}
.desc-label{font-size:13px;color:var(--muted)}
.desc{font-size:14px;line-height:2;color:#3b3e5c;white-space:pre-line}
.perks{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#62666d;border-top:1px solid var(--line);padding-top:12px}
.perks span::before{content:"✓ ";color:var(--green);font-weight:700}

footer{margin-top:40px;background:#fff;border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--muted);font-size:13px}
footer b{display:block;color:var(--red);font-size:18px;margin-bottom:6px}

@media(max-width:700px){
  .top{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%}
  .login{margin-right:auto}
  .hero{padding:24px 20px;min-height:160px}.hero h1{font-size:21px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:10px}.price{font-size:15px}
  .modal{grid-template-columns:1fr}
  .modal-img{border-left:0;border-bottom:1px solid var(--line)}
  .toolbar h2{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <a href="#" class="brand" onclick="resetAll();return false"><span style="font-size:26px">👑</span>فروشگاه مجلل</a>
      <label class="search">
        <span>🔍</span>
        <input id="q" type="search" placeholder="جستجو در فروشگاه مجلل..." autocomplete="off">
      </label>
      <button class="login">ورود | ثبت‌نام</button>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>بهترین کالاها با قیمت مناسب</h1>
    <p>موبایل، لوازم خانگی و سرویس چوب، همه در یک‌جا</p>
  </section>

  <div class="circles" id="circles"></div>

  <section class="amazing" id="amazing">
    <div class="amazing-head"><b>🔥 تازه‌ترین آگهی‌ها</b></div>
    <div class="strip" id="strip"></div>
  </section>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <div class="sort" id="sort">
      <button class="active" data-s="new">جدیدترین</button>
      <button data-s="cheap">ارزان‌ترین</button>
      <button data-s="exp">گران‌ترین</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>
</main>

<footer>
  <div class="wrap"><b>فروشگاه مجلل</b>خرید مطمئن، انتخاب راحت</div>
</footer>

<div id="modal" class="backdrop" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" onclick="closeModal()" aria-label="بستن">✕</button>
    <div class="modal-img"><img id="d-img" src="" alt=""></div>
    <div class="modal-info">
      <span class="tag" id="d-cat" style="align-self:flex-start"></span>
      <h2 id="d-title"></h2>
      <div class="m-price" id="d-price"></div>
      <div><div class="desc-label">توضیحات:</div><p class="desc" id="d-desc"></p></div>
      <div class="perks"><span>اصالت و سلامت فیزیکی کالا</span><span>امکان مشاهده و بررسی کالا</span></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://fermurffpsawrpulsxun.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_cnKr9_hRibLAttI-SkKoMA_cIbYIiWv';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const CATS=[
  {n:'همه',i:'🛍️',l:'همه کالاها'},
  {n:'موبایل',i:'📱',l:'موبایل'},
  {n:'لوازم خانگی',i:'🏠',l:'لوازم خانگی'},
  {n:'سرویس چوب',i:'🛋️',l:'سرویس چوب'}
];
const FALLBACK='https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=600';

let all=[],cat='همه',sortBy='new',query='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n?Number(n).toLocaleString('fa-IR'):'توافقی';
const safeImg=u=>/^https?:\/\//i.test(u||'')?u:FALLBACK;

function buildNav(){
  $('nav').innerHTML=CATS.map(c=>`<button data-c="${esc(c.n)}" class="${c.n===cat?'active':''}">${esc(c.l)}</button>`).join('');
  $('circles').innerHTML=CATS.map(c=>`<button class="circle ${c.n===cat?'active':''}" data-c="${esc(c.n)}"><i>${c.i}</i>${esc(c.l)}</button>`).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');
  if(c){cat=c.dataset.c;buildNav();render();return}
  const s=e.target.closest('#sort button');
  if(s){sortBy=s.dataset.s;document.querySelectorAll('#sort button').forEach(b=>b.classList.toggle('active',b===s));render()}
});
$('q').addEventListener('input',e=>{query=e.target.value.trim();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function resetAll(){cat='همه';query='';$('q').value='';buildNav();render();scrollTo({top:0,behavior:'smooth'})}

async function load(){
  $('grid').innerHTML='<div class="skeleton"></div>'.repeat(8);
  try{
    const {data,error}=await supabaseClient.from('products').select('*').order('id',{ascending:false});
    if(error)throw error;
    all=data||[];
    render();
  }catch(err){
    console.error(err);
    $('grid').innerHTML='<div class="status">خطا در بارگذاری محصولات. لطفاً صفحه را دوباره باز کنید.</div>';
  }
}

function cardHTML(p,i){
  return `<button class="card" data-i="${i}">
    <div class="thumb"><img src="${esc(safeImg(p.image_url))}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'"></div>
    <h3 class="card-title">${esc(p.title)}</h3>
    <div class="meta"><span class="tag">${esc(p.category||'متفرقه')}</span></div>
    <div class="price">${fmt(p.price)} ${p.price?'<small>تومان</small>':''}</div>
  </button>`;
}

let shown=[];
function render(){
  let list=all.filter(p=>cat==='همه'||(p.category||'').trim()===cat);
  if(query){const q=query.toLowerCase();list=list.filter(p=>(p.title||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q))}
  if(sortBy==='cheap')list=[...list].sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));
  if(sortBy==='exp')list=[...list].sort((a,b)=>(b.price||0)-(a.price||0));
  shown=list;
  $('count').textContent=list.length?`${list.length.toLocaleString('fa-IR')} کالا`:'';

  $('grid').innerHTML=list.length?list.map(cardHTML).join(''):'<div class="status">هیچ آگهی‌ای پیدا نشد. دسته یا عبارت جستجو را تغییر دهید.</div>';

  const recent=all.slice(0,8);
  $('amazing').classList.toggle('show',cat==='همه'&&!query&&recent.length>=3);
  $('strip').innerHTML=recent.map((p,i)=>cardHTML(p,'r'+i)).join('');
}

document.addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(!c)return;
  const k=c.dataset.i;
  const p=String(k).startsWith('r')?all.slice(0,8)[+k.slice(1)]:shown[+k];
  if(p)openModal(p);
});

function openModal(p){
  $('d-img').src=safeImg(p.image_url);
  $('d-img').alt=p.title||'';
  $('d-cat').textContent=p.category||'متفرقه';
  $('d-title').textContent=p.title||'';
  $('d-price').innerHTML=`${fmt(p.price)} ${p.price?'<small>تومان</small>':''}`;
  $('d-desc').textContent=p.description||'توضیحی ثبت نشده است.';
  $('modal').classList.add('open');
}
function closeModal(){$('modal').classList.remove('open')}

buildNav();
window.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
