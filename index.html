<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فروشگاه مجلل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* استایل‌های قبلی شما */
        body { font-family: 'Vazirmatn', sans-serif; background: #0e0d0b; color: #fff; text-align: center; }
        .product-card { border: 1px solid #3a3322; padding: 20px; margin: 10px; display: inline-block; width: 200px; }
    </style>
</head>
<body>
    <h1>محصولات فروشگاه مجلل</h1>
    <div id="products-container">در حال بارگذاری محصولات...</div>

    <script>
        const SUPABASE_URL = 'https://fermurffpsawrpulsxun.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cnKr9_hRibLAttI-SkKoMA_cIbYIiWv'; // کلید عمومی شما

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadProducts() {
            const { data, error } = await supabase.from('products').select('*');
            const container = document.getElementById('products-container');
            
            if (error) {
                container.innerHTML = 'خطا در بارگذاری محصولات';
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const div = document.createElement('div');
                div.className = 'product-card';
                div.innerHTML = `<h3>${product.title}</h3><p>${product.price} تومان</p>`;
                container.appendChild(div);
            });
        }

        loadProducts();
    </script>
</body>
</html>
