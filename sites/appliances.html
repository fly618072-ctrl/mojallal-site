<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محصولات | فروشگاه مجلل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0d0b; --panel: #16140f; --line: #3a3322;
    --gold: #c9a24b; --gold-soft: #e3c77e; --ivory: #f1e8d4; --muted: #9a9078;
    --danger: #b5483a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--ivory);
    font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8;
    background-image:
      linear-gradient(45deg, rgba(201,162,75,.05) 1px, transparent 1px),
      linear-gradient(-45deg, rgba(201,162,75,.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { max-width: 1050px; margin: 0 auto; padding: 24px 20px 70px; }

  .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .95rem; padding: 6px 0; }
  .back:hover { color: var(--gold-soft); }

  .head { text-align: center; padding: 30px 0 34px; }
  .head h1 {
    margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; line-height: 1.3;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold) 60%, #8f6f26);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head p { margin: 6px 0 0; color: var(--muted); font-weight: 300; }

  .btn {
    font-family: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
    border: 0; border-radius: 4px; padding: 11px 24px; transition: background .25s;
  }
  .btn-gold { background: var(--gold); color: #15110a; }
  .btn-gold:hover { background: var(--gold-soft); }
  .btn-ghost { background: transparent; color: var(--ivory); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--gold); }
  .btn-danger { background: transparent; color: #e08a7c; border: 1px solid #5a2e27; font-size: .85rem; padding: 7px 14px; }
  .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }

  .toolbar { display: flex; justify-content: center; margin-bottom: 26px; }

  /* فرم افزودن */
  .panel {
    display: none; max-width: 620px; margin: 0 auto 40px; padding: 28px;
    background: var(--panel); border: 1px solid var(--gold); border-radius: 6px;
  }
  .panel.open { display: block; }
  .panel h2 { margin: 0 0 18px; font-size: 1.25rem; font-weight: 600; color: var(--gold-soft); }
  label { display: block; margin-top: 14px; font-size: .92rem; color: var(--muted); }
  input[type="text"], textarea, input[type="file"] {
    width: 100%; margin-top: 6px; padding: 11px 12px;
    background: var(--ink); color: var(--ivory); font-family: inherit; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 4px;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--gold); }
  .preview { display: none; width: 100%; max-height: 220px; object-fit: contain; margin-top: 10px; border-radius: 4px; background: #000; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions .btn-gold { flex: 1; }
  .msg { margin-top: 12px; color: #e08a7c; font-size: .9rem; min-height: 1.4em; }

  /* لیست محصولات */
  .section-title { display: flex; align-items: center; gap: 18px; margin: 0 0 26px; font-size: 1.2rem; font-weight: 600; color: var(--gold-soft); }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
  .card {
    position: relative; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; cursor: pointer; transition: border-color .3s, transform .3s, box-shadow .3s;
  }
  .card:hover, .card:focus-visible { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 16px 34px rgba(0,0,0,.55); }
  .card .pic { aspect-ratio: 1 / 1; background: #1d1a13; display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { padding: 14px 16px 16px; }
  .card h3 { margin: 0 0 2px; font-size: 1.05rem; font-weight: 600; }
  .card .price { margin: 0; color: var(--gold-soft); font-weight: 600; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }

  /* جزئیات */
  dialog { width: min(560px, 92vw); padding: 0; background: var(--panel); color: var(--ivory); border: 1px solid var(--gold); border-radius: 6px; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  dialog img { width: 100%; max-height: 52vh; object-fit: contain; background: #000; display: block; }
  .dlg-body { padding: 20px 24px 24px; }
  .dlg-body h2 { margin: 0; font-size: 1.4rem; }
  .dlg-body .price { margin: 2px 0 12px; color: var(--gold-soft); font-weight: 600; font-size: 1.1rem; }
  .dlg-body p.desc { margin: 0; white-space: pre-line; color: var(--ivory); font-weight: 300; }
  .dlg-actions { display: flex; justify-content: space-between; margin-top: 22px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">بازگشت به صفحه اصلی</a>

  <div class="head">
    <h1 id="pageTitle">محصولات</h1>
    <p>فروشگاه مجلل، مشهد</p>
  </div>

  <div class="toolbar">
    <button class="btn btn-gold" id="toggleBtn" type="button">افزودن آگهی جدید</button>
  </div>

  <section class="panel" id="adminPanel" aria-label="افزودن محصول">
    <h2>افزودن محصول</h2>
    <label for="imgFile">عکس محصول</label>
    <input type="file" id="imgFile" accept="image/*">
    <img class="preview" id="preview" alt="پیش‌نمایش عکس">
    <label for="productName">نام محصول</label>
    <input type="text" id="productName">
    <label for="productPrice">قیمت</label>
    <input type="text" id="productPrice">
    <label for="productDesc">توضیحات</label>
    <textarea id="productDesc" rows="3"></textarea>
    <div class="msg" id="msg" role="alert"></div>
    <div class="actions">
      <button class="btn btn-gold" id="addBtn" type="button">ثبت آگهی</button>
      <button class="btn btn-ghost" id="cancelBtn" type="button">انصراف</button>
    </div>
  </section>

  <h2 class="section-title">محصولات ثبت‌شده</h2>
  <div class="grid" id="productGrid"></div>
</div>

<dialog id="detail">
  <img id="dImg" alt="">
  <div class="dlg-body">
    <h2 id="dName"></h2>
    <p class="price" id="dPrice"></p>
    <p class="desc" id="dDesc"></p>
    <div class="dlg-actions">
      <button class="btn btn-danger" id="dDelete" type="button">حذف این آگهی</button>
      <button class="btn btn-ghost" id="dClose" type="button">بستن</button>
    </div>
  </div>
</dialog>

<script>
  const TITLES = { "wood.html": "سرویس چوب", "mobile.html": "تلفن همراه", "appliances.html": "لوازم خانگی" };
  const KEY = decodeURIComponent(location.pathname.split("/").pop() || "products.html");
  if (TITLES[KEY]) {
    document.getElementById("pageTitle").textContent = TITLES[KEY];
    document.title = TITLES[KEY] + " | فروشگاه مجلل";
  }

  const $ = id => document.getElementById(id);
  let image = "";
  let openIndex = -1;

  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
  const write = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; } };

  // عکس را کوچک می‌کنیم تا حافظه‌ی مرورگر زود پر نشود
  function compress(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  $("imgFile").addEventListener("change", e => {
    const file = e.target.files[0];
    image = "";
    $("preview").style.display = "none";
    if (!file) return;
    compress(file, data => {
      image = data;
      $("preview").src = data;
      $("preview").style.display = "block";
    });
  });

  function setPanel(open) {
    $("adminPanel").classList.toggle("open", open);
    $("toggleBtn").textContent = open ? "بستن فرم" : "افزودن آگهی جدید";
    if (open) $("productName").focus();
  }
  $("toggleBtn").onclick = () => setPanel(!$("adminPanel").classList.contains("open"));
  $("cancelBtn").onclick = () => setPanel(false);

  function render() {
    const list = read(), grid = $("productGrid");
    grid.textContent = "";
    if (!list.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "هنوز محصولی ثبت نشده. با دکمه‌ی «افزودن آگهی جدید» اولین محصول را اضافه کنید.";
      grid.style.display = "block";
      grid.appendChild(d);
      return;
    }
    grid.style.display = "";
    list.forEach((p, i) => {
      const card = document.createElement("div");
      card.className = "card"; card.tabIndex = 0; card.setAttribute("role", "button");
      const pic = document.createElement("div"); pic.className = "pic";
      if (p.img) { const im = document.createElement("img"); im.src = p.img; im.alt = p.name; pic.appendChild(im); }
      else pic.textContent = "بدون عکس";
      const body = document.createElement("div"); body.className = "body";
      const h = document.createElement("h3"); h.textContent = p.name;
      const pr = document.createElement("p"); pr.className = "price"; pr.textContent = p.price;
      body.append(h, pr); card.append(pic, body);
      const show = () => showDetail(i);
      card.onclick = show;
      card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(); } };
      grid.appendChild(card);
    });
  }

  function showDetail(i) {
    const p = read()[i]; if (!p) return;
    openIndex = i;
    $("dImg").style.display = p.img ? "block" : "none";
    $("dImg").src = p.img || ""; $("dImg").alt = p.name;
    $("dName").textContent = p.name;
    $("dPrice").textContent = p.price;
    $("dDesc").textContent = p.desc || "";
    $("detail").showModal();
  }
  $("dClose").onclick = () => $("detail").close();
  $("detail").addEventListener("click", e => { if (e.target === $("detail")) $("detail").close(); });
  $("dDelete").onclick = () => {
    if (!confirm("آیا از حذف این آگهی مطمئن هستید؟")) return;
    const list = read(); list.splice(openIndex, 1); write(list);
    $("detail").close(); render();
  };

  $("addBtn").onclick = () => {
    const name = $("productName").value.trim(), price = $("productPrice").value.trim();
    if (!name) { $("msg").textContent = "نام محصول را وارد کنید."; return; }
    const list = read();
    list.push({ img: image, name, price, desc: $("productDesc").value.trim() });
    if (!write(list)) { $("msg").textContent = "حافظه‌ی مرورگر پر است. چند آگهی قدیمی را حذف کنید یا عکس کوچک‌تری انتخاب کنید."; return; }
    $("msg").textContent = "";
    ["productName", "productPrice", "productDesc", "imgFile"].forEach(id => $(id).value = "");
    image = ""; $("preview").style.display = "none";
    setPanel(false); render();
  };

  render();
</script>
</body>
</html>
